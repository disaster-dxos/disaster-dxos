# Nguồn dữ liệu "default": URL do lõi render từ OpenBao (role hasura chỉ có DML trên schema muon_thiet_bi).
- name: default
  kind: postgres
  configuration:
    connection_info:
      database_url:
        from_env: HASURA_GRAPHQL_DATABASE_URL
      isolation_level: read-committed
      pool_settings:
        max_connections: 5
        idle_timeout: 180
        retries: 1
      use_prepared_statements: true
  tables: "!include default/tables/tables.yaml"
