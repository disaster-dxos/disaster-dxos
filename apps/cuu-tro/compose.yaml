# Dịch vụ backend của apps/cuu-tro (#29), nạp từ docker-compose.yml của lõi bằng "include"
# (project_directory = gốc repo: đường dẫn tương đối và .env tính từ gốc repo).
# Profile "app": make up bật cùng profile core. Lõi chỉ biết quy ước:
#   - route APISIX /workflow/* → <DXOS_APP>-api:8000 (GW_WORKFLOW_UPSTREAM_HOST/PORT);
#   - role DB dịch vụ cuu_tro_app (postgres-roles tạo, migration 0003 cấp quyền);
#   - bí mật secret/app/cuu-tro/db + policy apps/cuu-tro/openbao/policies/*.hcl (openbao-init);
#   - NATS (#30): user cuu-tro-app (backend) / cuu-tro-thiet-bi (MQTT), subject cuu-tro.>,
#     mật khẩu secret/app/cuu-tro/nats.
#   - S3 (#27): bucket khai báo ở apps/cuu-tro/s3/buckets.conf (s3-buckets của lõi tạo), định danh
#     S3 cuu-tro-app chỉ dùng bucket cuu-tro-*, khóa secret/app/cuu-tro/s3; route /workflow/tai-len/*
#     (body nhị phân) và /files/* (chỉ đọc, link presigned) của APISIX.
# Không mở cổng nào ra máy host: client gọi API qua gateway, worker chỉ kéo việc từ Temporal,
# consumer cảm biến chỉ kéo bản tin từ NATS. Thiết bị gửi MQTT vào cổng của lõi (nats:1883).

x-cuu-tro-env: &cuu-tro-env
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  TEMPORAL_TASK_QUEUE: ${CUU_TRO_TASK_QUEUE:-cuu-tro}

services:
  bao-agent-cuu-tro:
    restart: unless-stopped
    image: openbao/openbao:2.7.1
    profiles: [app]
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      APP_DB_USER: cuu_tro_app
      POSTGRES_DB: ${POSTGRES_DB:-disaster}
    volumes:
      - ./apps/cuu-tro/openbao/agent-workflow.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/app-cuu-tro-workflow:/openbao/approle:ro
      - secrets-cuu-tro:/out/cuu-tro
      - secrets-cuu-tro-thiet-bi:/out/cuu-tro-thiet-bi
      - secrets-cuu-tro-api:/out/cuu-tro-api
    healthcheck:
      test: ["CMD-SHELL", "test -s /out/cuu-tro/APP_DB_URL && test -s /out/cuu-tro/NATS_URL && test -s /out/cuu-tro-thiet-bi/MQTT_PASSWORD && test -s /out/cuu-tro-api/S3_SECRET_KEY"]
      interval: 5s
      timeout: 3s
      retries: 24
    mem_limit: 64m

  cuu-tro-worker:
    # Image chung của worker và API, build từ apps/cuu-tro/workflow/Dockerfile. Chỉ dịch vụ này có
    # "build" (hai dịch vụ cùng build một tên image thì BuildKit báo "already exists")
    build:
      context: ./apps/cuu-tro/workflow
    image: disaster-dxos/cuu-tro-workflow:0.1.0
    restart: unless-stopped
    profiles: [app]
    # APP_DB_URL (role cuu_tro_app) do bao agent render, env-from-files.sh export rồi exec worker
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos"]
    command: ["python", "-m", "cuu_tro_workflow.worker"]
    depends_on:
      temporal:
        condition: service_healthy
      # Quyền của cuu_tro_app trên bảng do migration 0003 cấp
      migrate:
        condition: service_completed_successfully
      bao-agent-cuu-tro:
        condition: service_healthy
    environment:
      <<: *cuu-tro-env
      SECRETS_REQUIRED: APP_DB_URL
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - secrets-cuu-tro:/run/secrets/dxos:ro
    healthcheck:
      # Worker ghi lại /tmp/worker-alive mỗi 10 giây khi đang nhận việc từ Temporal
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-alive') > 30)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 256m

  cuu-tro-api:
    # Dùng lại image do cuu-tro-worker build (image cục bộ, không kéo từ registry)
    image: disaster-dxos/cuu-tro-workflow:0.1.0
    pull_policy: never
    restart: unless-stopped
    profiles: [app]
    # Kiểm JWT bằng JWKS công khai của Keycloak, hỏi Hasura bằng JWT người dùng. Ảnh hiện trường (#27):
    # APP_DB_URL (ghi incident_media) + khóa S3 của ứng dụng, volume riêng secrets-cuu-tro-api (không có
    # mật khẩu NATS/MQTT). env-from-files.sh export rồi exec uvicorn.
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos"]
    command: ["uvicorn", "cuu_tro_workflow.api:app", "--host", "0.0.0.0", "--port", "8000",
              "--root-path", "/workflow", "--no-server-header", "--no-access-log"]
    depends_on:
      temporal:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Bảng incident_media + quyền của cuu_tro_app (migration 0005), bucket cuu-tro-media
      migrate:
        condition: service_completed_successfully
      s3-buckets:
        condition: service_completed_successfully
      bao-agent-cuu-tro:
        condition: service_healthy
      # API không có worker thì workflow không chạy; cũng bảo đảm image đã build trước
      cuu-tro-worker:
        condition: service_started
    environment:
      <<: *cuu-tro-env
      SECRETS_REQUIRED: APP_DB_URL S3_ACCESS_KEY S3_SECRET_KEY
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-disaster}
      # D-008: lõi chỉ được gọi qua API Gateway (Hasura qua APISIX /graphql)
      GATEWAY_INTERNAL_URL: http://apisix:9080
      PHAN_CONG_BAN_KINH_M: ${PHAN_CONG_BAN_KINH_M:-20000}
      PHAN_CONG_HAN_XAC_NHAN_GIAY: ${PHAN_CONG_HAN_XAC_NHAN_GIAY:-21600}
      PHAN_CONG_SO_LAN_TIM_DOI: ${PHAN_CONG_SO_LAN_TIM_DOI:-10}
      PHAN_CONG_CHO_TIM_LAI_GIAY: ${PHAN_CONG_CHO_TIM_LAI_GIAY:-60}
      # Ảnh hiện trường (#27). API ghi S3 thẳng trong mạng nội bộ (seaweedfs:8333, khóa của ứng dụng);
      # link xem ký cho host công khai của gateway, client mở qua APISIX /files/* (kèm JWT)
      S3_ENDPOINT: http://seaweedfs:8333
      ANH_BUCKET: cuu-tro-media
      ANH_MAX_BYTES: ${ANH_MAX_BYTES:-10485760}
      ANH_LINK_HAN_GIAY: ${ANH_LINK_HAN_GIAY:-300}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:9080}
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - secrets-cuu-tro-api:/run/secrets/dxos:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    mem_limit: 192m

  cuu-tro-cam-bien:
    # Consumer luồng cảm biến (#30): tạo stream/consumer JetStream theo apps/cuu-tro/nats/streams.json,
    # ghi chuỗi đo vào sensor_readings, cập nhật sensors.last_*, phát cảnh báo vượt ngưỡng lên NATS.
    image: disaster-dxos/cuu-tro-workflow:0.1.0
    pull_policy: never
    restart: unless-stopped
    profiles: [app]
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos"]
    command: ["python", "-m", "cuu_tro_workflow.cam_bien_consumer"]
    depends_on:
      nats:
        condition: service_healthy
      # Bảng sensor_readings + quyền của cuu_tro_app do migration 0004 tạo
      migrate:
        condition: service_completed_successfully
      bao-agent-cuu-tro:
        condition: service_healthy
      cuu-tro-worker:
        condition: service_started
    environment:
      SECRETS_REQUIRED: APP_DB_URL NATS_URL
      NATS_STREAMS_FILE: /app/nats/streams.json
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - ./apps/cuu-tro/nats/streams.json:/app/nats/streams.json:ro
      - secrets-cuu-tro:/run/secrets/dxos:ro
    healthcheck:
      # Ghi lại /tmp/cam-bien-alive mỗi 10 giây sau khi đã khai báo stream và gắn consumer
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/cam-bien-alive') > 30)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 128m

  cuu-tro-gia-lap:
    # Bộ giả lập trạm cảm biến (#30), profile riêng "gia-lap": make up KHÔNG bật. Gửi một lần:
    #   docker compose --profile core --profile app run --rm --no-deps cuu-tro-gia-lap python -m cuu_tro_workflow.gia_lap --mot-lan
    # Chạy liên tục: docker compose --profile core --profile app --profile gia-lap up -d cuu-tro-gia-lap
    # Chỉ có mật khẩu thiết bị (MQTT, chỉ được gửi vào cuu-tro.>), không có bí mật nào khác.
    image: disaster-dxos/cuu-tro-workflow:0.1.0
    pull_policy: never
    restart: unless-stopped
    profiles: [gia-lap]
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos"]
    command: ["python", "-m", "cuu_tro_workflow.gia_lap", "--lien-tuc"]
    depends_on:
      nats:
        condition: service_healthy
      bao-agent-cuu-tro:
        condition: service_healthy
    environment:
      SECRETS_REQUIRED: MQTT_PASSWORD
      MQTT_HOST: nats
      MQTT_PORT: "1883"
      MQTT_USERNAME: cuu-tro-thiet-bi
      GIA_LAP_KICH_BAN: ${GIA_LAP_KICH_BAN:-binh-thuong}
      GIA_LAP_CHU_KY_GIAY: ${GIA_LAP_CHU_KY_GIAY:-10}
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - secrets-cuu-tro-thiet-bi:/run/secrets/dxos:ro
    mem_limit: 64m

volumes:
  # Bí mật đã render (tmpfs, mất khi dừng); uid/gid của user openbao trong image agent
  secrets-cuu-tro:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=1000,mode=0755,size=1m"
  secrets-cuu-tro-thiet-bi:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=1000,mode=0755,size=1m"
  secrets-cuu-tro-api:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=1000,mode=0755,size=1m"
