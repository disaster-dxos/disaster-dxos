# SPDX-License-Identifier: Apache-2.0
# Dịch vụ backend của apps/cuu-tro (#29), nạp từ docker-compose.yml của lõi bằng "include"
# (project_directory = gốc repo: đường dẫn tương đối và .env tính từ gốc repo).
# Profile "app": make up bật cùng profile core. Lõi chỉ biết quy ước:
#   - route APISIX /workflow/* → <DXOS_APP>-api:8000 (GW_WORKFLOW_UPSTREAM_HOST/PORT);
#   - role DB dịch vụ cuu_tro_app (postgres-roles tạo, migration 0003 cấp quyền);
#   - bí mật secret/app/cuu-tro/db + policy apps/cuu-tro/openbao/policies/*.hcl (openbao-init);
#   - NATS (#30): user cuu-tro-app (backend) / cuu-tro-thiet-bi (MQTT), subject cuu-tro.>,
#     mật khẩu secret/app/cuu-tro/nats.
#   - S3 (#27): bucket khai báo ở apps/cuu-tro/s3/buckets.conf (s3-buckets của lõi tạo), định danh
#     S3 cuu-tro-app chỉ dùng bucket cuu-tro-*, khóa secret/app/cuu-tro/s3; route /workflow/tai-len/*
#     (body nhị phân) và /files/* (chỉ đọc, link presigned) của APISIX.
#   - Sổ cái (#28): cuu-tro-api ghi lá lên core/ledger (ledger:8090, mạng nội bộ) bằng token
#     secret/app/cuu-tro/ledger; trang công khai qua route /workflow/minh-bach/* (không JWT).
#   - Web điều phối (#64): route APISIX /* (ưu tiên thấp nhất) → <DXOS_APP>-web:3000
#     (GW_WEB_UPSTREAM_HOST/PORT); client Keycloak dxos-web nhận redirect ${GATEWAY_PUBLIC_URL}/*.
#   - Thông báo realtime (#68): Centrifugo của lõi kiểm token HS256 iss "cuu-tro-api"; cuu-tro-api cấp
#     token (GET /workflow/realtime/token), cuu-tro-thong-bao đẩy sự kiện NATS lên kênh dieu-phoi;
#     bí mật secret/app/cuu-tro/realtime. Web mở WebSocket qua APISIX /realtime/websocket.
#   - Bản sao số NGSI-LD (#85): cuu-tro-ban-sao-so ghi thực thể trạm đo lên Scorpio của lõi (scorpio:9090);
#     cuu-tro-api phục vụ @context (apps/cuu-tro/ngsi-ld/context.jsonld) cho route APISIX /ngsi-ld/v1/*
#     (GW_NGSI_LD_CONTEXT_URL). Người dùng đọc thực thể qua gateway, không ghi được.
# Không mở cổng nào ra máy host: client gọi API và mở web qua gateway, worker chỉ kéo việc từ Temporal,
# consumer cảm biến chỉ kéo bản tin từ NATS. Thiết bị gửi MQTT vào cổng của lõi (nats:1883).

x-cuu-tro-env: &cuu-tro-env
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  TEMPORAL_TASK_QUEUE: ${CUU_TRO_TASK_QUEUE:-cuu-tro}
  # Tham số PhanCongCuuHo: API (khởi chạy tay) và bộ khởi chạy tự động trong worker (#67) dùng chung
  PHAN_CONG_BAN_KINH_M: ${PHAN_CONG_BAN_KINH_M:-20000}
  PHAN_CONG_HAN_XAC_NHAN_GIAY: ${PHAN_CONG_HAN_XAC_NHAN_GIAY:-21600}
  PHAN_CONG_SO_LAN_TIM_DOI: ${PHAN_CONG_SO_LAN_TIM_DOI:-10}
  PHAN_CONG_CHO_TIM_LAI_GIAY: ${PHAN_CONG_CHO_TIM_LAI_GIAY:-60}
  PHAN_CONG_HAN_NHAN_GIAY_KHAN_CAP: ${PHAN_CONG_HAN_NHAN_GIAY_KHAN_CAP:-300}
  PHAN_CONG_HAN_NHAN_GIAY_CAO: ${PHAN_CONG_HAN_NHAN_GIAY_CAO:-600}
  PHAN_CONG_HAN_NHAN_GIAY_TRUNG_BINH: ${PHAN_CONG_HAN_NHAN_GIAY_TRUNG_BINH:-900}
  PHAN_CONG_HAN_NHAN_GIAY_THAP: ${PHAN_CONG_HAN_NHAN_GIAY_THAP:-1800}
  PHAN_CONG_SO_LAN_GIAO_TOI_DA: ${PHAN_CONG_SO_LAN_GIAO_TOI_DA:-3}

services:
  bao-agent-cuu-tro:
    restart: unless-stopped
    image: openbao/openbao:2.7.1
    profiles: [app]
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      APP_DB_USER: cuu_tro_app
      POSTGRES_DB: ${POSTGRES_DB:-disaster}
    volumes:
      - ./apps/cuu-tro/openbao/agent-workflow.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/app-cuu-tro-workflow:/openbao/approle:ro
      - secrets-cuu-tro:/out/cuu-tro
      - secrets-cuu-tro-thiet-bi:/out/cuu-tro-thiet-bi
      - secrets-cuu-tro-api:/out/cuu-tro-api
      - secrets-cuu-tro-thong-bao:/out/cuu-tro-thong-bao
      - secrets-cuu-tro-worker:/out/cuu-tro-worker
      - secrets-cuu-tro-luu-tru:/out/cuu-tro-luu-tru
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          for f in cuu-tro/APP_DB_URL cuu-tro/NATS_URL cuu-tro-thiet-bi/MQTT_PASSWORD cuu-tro-api/S3_SECRET_KEY
          cuu-tro-api/LEDGER_WRITE_TOKEN cuu-tro-api/REALTIME_TOKEN_SECRET cuu-tro-thong-bao/CENTRIFUGO_API_KEY
          cuu-tro-thong-bao/NATS_URL cuu-tro-worker/APP_DB_URL cuu-tro-worker/NATS_URL cuu-tro-worker/LEDGER_WRITE_TOKEN
          cuu-tro-luu-tru/BI_DB_URL cuu-tro-luu-tru/S3_SECRET_KEY;
          do test -s /out/$$f || exit 1; done;
          test -e /out/cuu-tro-worker/TELEGRAM_BOT_TOKEN && test -e /out/cuu-tro-api/LLM_API_KEY
      interval: 5s
      timeout: 3s
      retries: 24
    mem_limit: 64m

  cuu-tro-worker:
    # Image chung của worker và API, build từ apps/cuu-tro/workflow/Dockerfile. Chỉ dịch vụ này có
    # "build" (hai dịch vụ cùng build một tên image thì BuildKit báo "already exists")
    build:
      context: ./apps/cuu-tro/workflow
    image: disaster-dxos/cuu-tro-workflow:0.3.0
    restart: unless-stopped
    profiles: [app]
    # APP_DB_URL (role cuu_tro_app) do bao agent render, env-from-files.sh export rồi exec worker.
    # Cùng tiến trình: bộ khởi chạy tự động (#67) LISTEN cuu_tro_tin_moi + quét outbox assignment_queue;
    # NATS_URL để báo điều phối (stream CUU_TRO_DIEU_PHOI, worker tự khai báo stream khi khởi động).
    # Cảnh báo vượt ngưỡng (#87): consumer canh-bao-temporal → workflow CanhBaoVuotNguong → activity
    # gui_canh_bao, kênh CANH_BAO_KENH (gia-lap: hộp thư nội bộ + web; telegram: thêm Bot API). Token bot
    # (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) chỉ trong volume riêng secrets-cuu-tro-worker.
    # Sổ cái (#89): bộ niêm phong bù trong worker, LEDGER_WRITE_TOKEN cùng volume riêng đó.
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos"]
    command: ["python", "-m", "cuu_tro_workflow.worker"]
    depends_on:
      temporal:
        condition: service_healthy
      nats:
        condition: service_healthy
      # Quyền của cuu_tro_app trên bảng do migration 0003 cấp
      migrate:
        condition: service_completed_successfully
      bao-agent-cuu-tro:
        condition: service_healthy
    environment:
      <<: *cuu-tro-env
      SECRETS_REQUIRED: APP_DB_URL NATS_URL
      NATS_STREAMS_FILE: /app/nats/streams.json
      PHAN_CONG_TU_DONG: ${PHAN_CONG_TU_DONG:-1}
      PHAN_CONG_QUET_GIAY: ${PHAN_CONG_QUET_GIAY:-30}
      CANH_BAO_KENH: ${CANH_BAO_KENH:-gia-lap}
      CANH_BAO_HAN_DOT_GIAY: ${CANH_BAO_HAN_DOT_GIAY:-604800}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      # Liên kết "Web điều phối" trong nội dung tin
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:9080}
      # Bộ niêm phong bù sổ cái (#89): ghi lá cho phiếu kho / bút toán tiền chưa niêm phong (core/ledger nội bộ)
      LEDGER_URL: http://ledger:8090
      SO_CAI_QUET_GIAY: ${SO_CAI_QUET_GIAY:-10}
      SO_CAI_CHO_GIAY: ${SO_CAI_CHO_GIAY:-5}
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - ./apps/cuu-tro/nats/streams.json:/app/nats/streams.json:ro
      - secrets-cuu-tro-worker:/run/secrets/dxos:ro
    healthcheck:
      # Worker ghi lại /tmp/worker-alive mỗi 10 giây khi đang nhận việc từ Temporal
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-alive') > 30)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 256m

  cuu-tro-api:
    # Dùng lại image do cuu-tro-worker build (image cục bộ, không kéo từ registry)
    image: disaster-dxos/cuu-tro-workflow:0.3.0
    pull_policy: never
    restart: unless-stopped
    profiles: [app]
    # Kiểm JWT bằng JWKS công khai của Keycloak, hỏi Hasura bằng JWT người dùng. Ảnh hiện trường (#27):
    # APP_DB_URL (ghi incident_media) + khóa S3 của ứng dụng, volume riêng secrets-cuu-tro-api (không có
    # mật khẩu NATS/MQTT). Sổ cái (#28): LEDGER_WRITE_TOKEN để lập phiếu nhập/xuất rồi ghi lá lên
    # core/ledger. Realtime (#68): REALTIME_TOKEN_SECRET để cấp token kết nối Centrifugo. Kêu cứu (#66):
    # APP_DB_URL để tạo tin (trigger CSDL chặn trùng, ghi outbox phân công). Không bật access log.
    # env-from-files.sh export rồi exec uvicorn.
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos"]
    command: ["uvicorn", "cuu_tro_workflow.api:app", "--host", "0.0.0.0", "--port", "8000",
              "--root-path", "/workflow", "--no-server-header", "--no-access-log"]
    depends_on:
      temporal:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Bảng incident_media + quyền của cuu_tro_app (migration 0005), bucket cuu-tro-media
      migrate:
        condition: service_completed_successfully
      s3-buckets:
        condition: service_completed_successfully
      bao-agent-cuu-tro:
        condition: service_healthy
      # Sổ cái của lõi (#28): phiếu nhập/xuất ghi lá ngay khi lập (migration 0006: quyền cuu_tro_app)
      ledger:
        condition: service_healthy
      # API không có worker thì workflow không chạy; cũng bảo đảm image đã build trước
      cuu-tro-worker:
        condition: service_started
    environment:
      <<: *cuu-tro-env
      SECRETS_REQUIRED: APP_DB_URL S3_ACCESS_KEY S3_SECRET_KEY LEDGER_WRITE_TOKEN REALTIME_TOKEN_SECRET
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-disaster}
      # D-008: lõi chỉ được gọi qua API Gateway (Hasura qua APISIX /graphql)
      GATEWAY_INTERNAL_URL: http://apisix:9080
      # Ảnh hiện trường (#27). API ghi S3 thẳng trong mạng nội bộ (seaweedfs:8333, khóa của ứng dụng);
      # link xem ký cho host công khai của gateway, client mở qua APISIX /files/* (kèm JWT)
      S3_ENDPOINT: http://seaweedfs:8333
      ANH_BUCKET: cuu-tro-media
      ANH_MAX_BYTES: ${ANH_MAX_BYTES:-10485760}
      ANH_LINK_HAN_GIAY: ${ANH_LINK_HAN_GIAY:-300}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:9080}
      # Tiếp nhận tin kêu cứu (#66): vùng phục vụ kinh_do_min,vi_do_min,kinh_do_max,vi_do_max (trống = Việt Nam).
      # INSERT bằng APP_DB_URL (role cuu_tro_app, migration 0008)
      KEU_CUU_VUNG_PHUC_VU: ${KEU_CUU_VUNG_PHUC_VU:-}
      # Sổ cái (#28): ghi và lấy proof trong mạng nội bộ (APISIX chặn mọi phương thức ghi /ledger/*).
      # Khóa công khai để tự kiểm chữ ký checkpoint; trống = lấy một lần từ ledger lúc chạy.
      LEDGER_URL: http://ledger:8090
      LEDGER_VERIFIER_KEY: ${LEDGER_VERIFIER_KEY:-}
      # Hạn token kết nối Centrifugo (#68), 30-3600 giây; web tự xin token mới trước khi hết hạn
      REALTIME_TOKEN_HAN_GIAY: ${REALTIME_TOKEN_HAN_GIAY:-300}
      # Bản sao số (#85): phục vụ @context NGSI-LD ở /ngsi-ld/context.jsonld cho Scorpio tải (mạng nội bộ)
      NGSI_LD_CONTEXT_FILE: /app/ngsi-ld/context.jsonld
      # AI bóc tách tin kêu cứu (#102): gia-lap | ollama (dịch vụ ollama của profile ai) | openai-compatible | tat.
      # LLM_API_KEY (openai-compatible) do bao agent render từ secret/app/cuu-tro/llm, không ở .env
      LLM_PROVIDER: ${LLM_PROVIDER:-gia-lap}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_GIAY: ${LLM_TIMEOUT_GIAY:-120}
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - ./apps/cuu-tro/ngsi-ld/context.jsonld:/app/ngsi-ld/context.jsonld:ro
      - secrets-cuu-tro-api:/run/secrets/dxos:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    mem_limit: 192m

  cuu-tro-cam-bien:
    # Consumer luồng cảm biến (#30): tạo stream/consumer JetStream theo apps/cuu-tro/nats/streams.json,
    # ghi chuỗi đo vào sensor_readings, cập nhật sensors.last_*, phát cảnh báo vượt ngưỡng lên NATS.
    image: disaster-dxos/cuu-tro-workflow:0.3.0
    pull_policy: never
    restart: unless-stopped
    profiles: [app]
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos"]
    command: ["python", "-m", "cuu_tro_workflow.cam_bien_consumer"]
    depends_on:
      nats:
        condition: service_healthy
      # Bảng sensor_readings + quyền của cuu_tro_app do migration 0004 tạo
      migrate:
        condition: service_completed_successfully
      bao-agent-cuu-tro:
        condition: service_healthy
      cuu-tro-worker:
        condition: service_started
    environment:
      SECRETS_REQUIRED: APP_DB_URL NATS_URL
      NATS_STREAMS_FILE: /app/nats/streams.json
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - ./apps/cuu-tro/nats/streams.json:/app/nats/streams.json:ro
      - secrets-cuu-tro:/run/secrets/dxos:ro
    healthcheck:
      # Ghi lại /tmp/cam-bien-alive mỗi 10 giây sau khi đã khai báo stream và gắn consumer
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/cam-bien-alive') > 30)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 128m

  cuu-tro-ban-sao-so:
    # Bản sao số trạm đo (#85): consumer bền thứ hai "ban-sao-so" trên stream CUU_TRO_CAM_BIEN (độc lập với
    # ghi-csdl), upsert thực thể NGSI-LD của trạm lên Scorpio của lõi (scorpio:9090, mạng nội bộ); bản tin
    # cũ hơn lần đo đang có thì bỏ qua, Scorpio lỗi thì giao lại có hẹn giờ. Đọc tên, tọa độ, ngưỡng của
    # trạm bằng role cuu_tro_app (migration 0009, chỉ đọc). @context: apps/cuu-tro/ngsi-ld/context.jsonld.
    image: disaster-dxos/cuu-tro-workflow:0.3.0
    pull_policy: never
    restart: unless-stopped
    profiles: [app]
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos"]
    command: ["python", "-m", "cuu_tro_workflow.ban_sao_so"]
    depends_on:
      nats:
        condition: service_healthy
      scorpio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bao-agent-cuu-tro:
        condition: service_healthy
      # Stream CUU_TRO_CAM_BIEN do cuu-tro-cam-bien khai báo trước (consumer này cũng khai báo nếu chưa có)
      cuu-tro-cam-bien:
        condition: service_started
    environment:
      SECRETS_REQUIRED: APP_DB_URL NATS_URL
      NATS_STREAMS_FILE: /app/nats/streams.json
      NGSI_LD_URL: http://scorpio:9090
      NGSI_LD_CONTEXT_FILE: /app/ngsi-ld/context.jsonld
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - ./apps/cuu-tro/nats/streams.json:/app/nats/streams.json:ro
      - ./apps/cuu-tro/ngsi-ld/context.jsonld:/app/ngsi-ld/context.jsonld:ro
      - secrets-cuu-tro:/run/secrets/dxos:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/ban-sao-so-alive') > 30)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 96m

  cuu-tro-thong-bao:
    # Cầu nối thông báo realtime (#68): kéo từ consumer bền realtime-* (stream CUU_TRO_DIEU_PHOI: cần xử
    # lý, tin mới, thông báo cảnh báo trạm đo do workflow #87 đã gửi), chỉ chép trường không định danh, POST
    # /api/publish của Centrifugo (idempotency_key = Nats-Msg-Id), Centrifugo nhận mới ack.
    # Bí mật: NATS_URL + CENTRIFUGO_API_KEY (volume riêng), không có mật khẩu DB.
    image: disaster-dxos/cuu-tro-workflow:0.3.0
    pull_policy: never
    restart: unless-stopped
    profiles: [app]
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos"]
    command: ["python", "-m", "cuu_tro_workflow.thong_bao_cau_noi"]
    depends_on:
      nats:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      bao-agent-cuu-tro:
        condition: service_healthy
      cuu-tro-worker:
        condition: service_started
    environment:
      SECRETS_REQUIRED: NATS_URL CENTRIFUGO_API_KEY
      NATS_STREAMS_FILE: /app/nats/streams.json
      CENTRIFUGO_API_URL: http://centrifugo:8000
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - ./apps/cuu-tro/nats/streams.json:/app/nats/streams.json:ro
      - secrets-cuu-tro-thong-bao:/run/secrets/dxos:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/thong-bao-alive') > 30)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 96m

  cuu-tro-gia-lap:
    # Bộ giả lập trạm cảm biến (#30), profile riêng "gia-lap": make up KHÔNG bật. Gửi một lần:
    #   docker compose --profile core --profile app run --rm --no-deps cuu-tro-gia-lap python -m cuu_tro_workflow.gia_lap --mot-lan
    # Chạy liên tục: docker compose --profile core --profile app --profile gia-lap up -d cuu-tro-gia-lap
    # Chỉ có mật khẩu thiết bị (MQTT, chỉ được gửi vào cuu-tro.>), không có bí mật nào khác.
    image: disaster-dxos/cuu-tro-workflow:0.3.0
    pull_policy: never
    restart: unless-stopped
    profiles: [gia-lap]
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos"]
    command: ["python", "-m", "cuu_tro_workflow.gia_lap", "--lien-tuc"]
    depends_on:
      nats:
        condition: service_healthy
      bao-agent-cuu-tro:
        condition: service_healthy
    environment:
      SECRETS_REQUIRED: MQTT_PASSWORD
      MQTT_HOST: nats
      MQTT_PORT: "1883"
      MQTT_USERNAME: cuu-tro-thiet-bi
      GIA_LAP_KICH_BAN: ${GIA_LAP_KICH_BAN:-binh-thuong}
      GIA_LAP_CHU_KY_GIAY: ${GIA_LAP_CHU_KY_GIAY:-10}
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - secrets-cuu-tro-thiet-bi:/run/secrets/dxos:ro
    mem_limit: 64m

  cuu-tro-luu-tru:
    # Lưu trữ lịch sử (#91), profile riêng "luu-tru", chạy một lần (make luu-tru, make luu-tru-truy-van):
    # đọc CSDL bằng role CHỈ ĐỌC cuu_tro_bi (migration 0012: không có cột định danh), ghi Parquet phân vùng
    # theo tháng lên bucket cuu-tro-lakehouse của SeaweedFS (khóa S3 của ứng dụng), truy vấn bằng DuckDB.
    # Bí mật riêng (volume secrets-cuu-tro-luu-tru): BI_DB_URL, S3_ACCESS_KEY, S3_SECRET_KEY.
    image: disaster-dxos/cuu-tro-workflow:0.3.0
    pull_policy: never
    restart: "no"
    profiles: [luu-tru]
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos"]
    command: ["python", "-m", "cuu_tro_workflow.luu_tru", "xuat"]
    depends_on:
      bao-agent-cuu-tro:
        condition: service_healthy
    environment:
      SECRETS_REQUIRED: BI_DB_URL S3_ACCESS_KEY S3_SECRET_KEY
      S3_ENDPOINT: http://seaweedfs:8333
      LUU_TRU_BUCKET: cuu-tro-lakehouse
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - secrets-cuu-tro-luu-tru:/run/secrets/dxos:ro
    # DuckDB giữ một phân vùng trong bộ nhớ khi ghi; tệp tạm trong /tmp của container
    mem_limit: 512m

  cuu-tro-web:
    # Web điều phối (#59, #64): Nuxt build từ mã nguồn (apps/cuu-tro/web/Dockerfile), chạy Nitro node
    # server, user không phải root. Mở qua APISIX (route /*, có Coraza WAF), không mở cổng ra host:
    # http://localhost:9080/ (GATEWAY_PUBLIC_URL). Không có bí mật: dxos-web là client công khai (PKCE);
    # chỉ có URL công khai, Nitro chèn vào trang lúc chạy (runtimeConfig NUXT_PUBLIC_*).
    build:
      context: ./apps/cuu-tro/web
      # Bộ logo của repo nằm ngoài thư mục web (nuxt.config.ts phục vụ ở /logo)
      additional_contexts:
        logo: ./docs/images/logo
    image: disaster-dxos/cuu-tro-web:0.3.0
    restart: unless-stopped
    profiles: [app]
    environment:
      NUXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      NUXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-disaster}
      NUXT_PUBLIC_KEYCLOAK_CLIENT_ID: dxos-web
      NUXT_PUBLIC_GATEWAY_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:9080}
      NUXT_PUBLIC_MAP_STYLE_URL: ${NUXT_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      NUXT_PUBLIC_MAP_STYLE_URL_TOI: ${NUXT_PUBLIC_MAP_STYLE_URL_TOI:-https://tiles.openfreemap.org/styles/dark}
    # Mã chỉ đọc, không ghi gì ra đĩa
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m

volumes:
  # Bí mật đã render (tmpfs, mất khi dừng); uid/gid của user openbao trong image agent
  secrets-cuu-tro:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=1000,mode=0755,size=1m"
  secrets-cuu-tro-thiet-bi:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=1000,mode=0755,size=1m"
  secrets-cuu-tro-thong-bao:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=1000,mode=0755,size=1m"
  secrets-cuu-tro-luu-tru:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=1000,mode=0755,size=1m"
  secrets-cuu-tro-worker:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=1000,mode=0755,size=1m"
  secrets-cuu-tro-api:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=1000,mode=0755,size=1m"
