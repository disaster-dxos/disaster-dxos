# Bucket S3 (SeaweedFS) của apps/cuu-tro (#27). Container s3-buckets của lõi tạo các bucket còn thiếu
# mỗi lần make up (core/seaweedfs/create-buckets.sh). Mỗi dòng một tên; tên PHẢI bắt đầu bằng
# "cuu-tro-": định danh S3 của ứng dụng (secret/app/cuu-tro/s3) chỉ dùng được bucket "cuu-tro-*".
# Mọi bucket riêng tư: SeaweedFS không có định danh nặc danh, request không ký → 403.

# Ảnh hiện trường gắn với tin kêu cứu: su-co/<incident_id>/<media_id>.<jpg|png|webp>
cuu-tro-media

