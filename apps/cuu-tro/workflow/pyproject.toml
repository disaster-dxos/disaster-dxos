# SPDX-License-Identifier: Apache-2.0
# Backend nghiệp vụ của apps/cuu-tro (#29): Temporal worker + API mỏng khởi chạy workflow;
# luồng cảm biến mực nước (#30): giả lập MQTT, consumer NATS JetStream ghi chuỗi đo.
# Phụ thuộc ghim phiên bản; khóa đầy đủ (kể cả phụ thuộc gián tiếp, kèm hash) ở uv.lock.
# requirements.txt sinh từ uv.lock cho image Docker và job CI pytest:
#   uv lock && uv export --frozen --no-dev --no-emit-project -o requirements.txt
[project]
name = "cuu-tro-workflow"
version = "0.1.0"
description = "Workflow phân công cứu hộ (Temporal) và API khởi chạy qua API Gateway"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "temporalio==1.34.0",
  "fastapi==0.150.0",
  "uvicorn==0.54.0",
  "asyncpg==0.32.0",
  "pyjwt[crypto]==2.15.1",
  "httpx==0.28.1",
  # Cảm biến (#30): consumer JetStream và bộ giả lập gửi MQTT
  "nats-py==2.16.0",
  "paho-mqtt==2.1.0",
  # Sổ cái (#28): kiểm chữ ký Ed25519 của checkpoint (đã có sẵn qua pyjwt[crypto], khai báo trực tiếp)
  "cryptography==50.0.2",
]

[dependency-groups]
# Cùng phiên bản pytest với job CI (.github/workflows/ci.yml)
dev = ["pytest==8.3.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
