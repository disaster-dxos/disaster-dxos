# Bí mật riêng của apps/cuu-tro mà lõi không biết ý nghĩa (#87). scripts/openbao-init.sh tạo mỗi dòng thành
# secret/app/cuu-tro/<đường dẫn> NẾU CHƯA CÓ (không bao giờ ghi đè giá trị đã đặt).
# Mỗi dòng: <đường dẫn> <khóa>=<@empty | @rand[:n]> ...
#
# Thông báo cảnh báo qua Telegram (#87): để trống thì chỉ chạy được kênh gia-lap. Bật Telegram thật:
#   bao kv put secret/app/cuu-tro/telegram bot_token=<token từ @BotFather> chat_id=<id nhóm/kênh>
# rồi đặt CANH_BAO_KENH=telegram trong .env và make up (apps/cuu-tro/README.md mục "Cảnh báo vượt ngưỡng").
telegram bot_token=@empty chat_id=@empty
