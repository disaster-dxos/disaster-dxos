#               Hasura: API ghi phiếu và ghi lá lên sổ cái minh bạch trong cùng một luồng, nên không có
#               phiếu nào lọt khỏi sổ cái. Không sửa, không xóa: phiếu bất biến (trigger #25); cột ledger_*
