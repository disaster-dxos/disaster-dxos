table:
  name: supply_movements
  schema: cuu_tro
configuration:
  custom_name: supply_movements
  column_config: {}
  custom_column_names: {}
  custom_root_fields: {}
object_relationships:
  - name: supply
    using:
      foreign_key_constraint_on: supply_id
  - name: shelter
    using:
      foreign_key_constraint_on: shelter_id
select_permissions:
  - role: dieu-phoi
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
