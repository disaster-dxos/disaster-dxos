# Trạm cảm biến. Giá trị đo (last_value, last_observed_at) do luồng NATS → NGSI-LD (#30) ghi,
# không qua vai trò người dùng.
#   dieu-phoi   đọc; chỉnh tên, ngưỡng cảnh báo/nguy hiểm, bật/tắt trạm. Không tạo/xóa (thuộc #30)
#   cuu-ho      chỉ đọc (đội hiện trường cần mực nước)
table:
  name: sensors
  schema: cuu_tro
configuration:
  custom_name: sensors
  column_config: {}
  custom_column_names: {}
  custom_root_fields: {}
select_permissions:
  - role: dieu-phoi
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: cuu-ho
    permission:
      columns: "*"
      filter: {}
update_permissions:
  - role: dieu-phoi
    permission:
      columns:
        - name
        - warning_threshold
        - danger_threshold
        - active
      filter: {}
      check: {}
