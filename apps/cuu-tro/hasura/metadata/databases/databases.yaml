# Nguồn dữ liệu duy nhất "default": URL lấy từ biến môi trường (render từ OpenBao, role hasura chỉ
# có DML trên schema cuu_tro), không ghi bí mật vào metadata. Pool nhỏ cho laptop.
- name: default
  kind: postgres
  configuration:
    connection_info:
      database_url:
        from_env: HASURA_GRAPHQL_DATABASE_URL
      isolation_level: read-committed
      pool_settings:
        max_connections: 10
        idle_timeout: 180
        retries: 1
      use_prepared_statements: true
  tables: "!include default/tables/tables.yaml"
