# SPDX-License-Identifier: Apache-2.0
# Route của API Gateway (standalone, #12). APISIX tự nạp lại khi file đổi.
# Bảng route, luồng JWT và WAF: docs/architecture.md mục 3.3.
#
# Quy ước:
#  - Mọi route nghiệp vụ bắt buộc Bearer JWT do Keycloak realm "disaster" ký (openid-connect,
#    kiểm chữ ký bằng JWKS, không gọi introspection). Hasura vẫn kiểm JWT lần 2 (Zero-Trust).
#  - Thứ tự xử lý một request: Coraza WAF + OWASP CRS chặn (403) → kiểm JWT (401) → limit-count
#    theo IP (429) → upstream. WAF và JWT ở pha rewrite, limit-count ở pha access của APISIX.
#  - ${{TÊN:=mặc định}} là biến môi trường, APISIX thay khi nạp file (khai báo trong
#    config.yaml nginx_config.envs, đặt giá trị trong .env).
# File PHẢI kết thúc bằng dòng "#END".

upstreams:
  - id: keycloak
    type: roundrobin
    nodes:
      "keycloak:8080": 1
  - id: hasura
    type: roundrobin
    nodes:
      "hasura:8080": 1
  - id: seaweedfs-s3
    type: roundrobin
    # SeaweedFS tính chữ ký SigV4 theo X-Forwarded-Host mà APISIX gửi, tức host công khai của
    # gateway (vd localhost:9080). Dịch vụ cấp URL presigned (#27) ký cho host đó, path không có /files.
    nodes:
      "seaweedfs:8333": 1
  - id: workflow-api
    type: roundrobin
    # API workflow của ứng dụng Tầng 2 (#29), không thuộc lõi: host/port lấy từ biến môi trường,
    # mặc định theo quy ước <DXOS_APP>-api:8000 (docker-compose.yml). Dạng mảng vì APISIX chỉ thay
    # biến ${{...}} trong giá trị, không thay trong khóa. Lõi chạy một mình (không có app) thì
    # route này trả 502/503, các route khác không ảnh hưởng.
    nodes:
      - host: "${{GW_WORKFLOW_UPSTREAM_HOST:=workflow-api}}"
        port: ${{GW_WORKFLOW_UPSTREAM_PORT:=8000}}
        weight: 1
    timeout:
      connect: 5
      send: 35
      read: 35

  - id: ledger
    type: roundrobin
    # Sổ cái minh bạch của lõi (#28): chỉ các đường đọc công khai đi qua gateway
    nodes:
      "ledger:8090": 1
    timeout:
      connect: 5
      send: 15
      read: 15

  - id: centrifugo
    type: roundrobin
    # Centrifugo OSS của lõi (#68): chỉ đường WebSocket của client đi qua gateway; HTTP API (/api/*)
    # của Centrifugo chỉ dùng trong mạng nội bộ, không có route ra ngoài.
    nodes:
      "centrifugo:8000": 1
    timeout:
      connect: 5
      # Kết nối WebSocket sống lâu: Centrifugo ping mỗi 25 giây, đọc/gửi im lặng quá 60 giây thì đóng
      send: 60
      read: 60

  - id: scorpio
    type: roundrobin
    # NGSI-LD broker của lõi (#85): chỉ các đường đọc thực thể đi qua gateway; ghi (entityOperations,
    # POST/PATCH/DELETE) chỉ từ backend ứng dụng trong mạng nội bộ (scorpio:9090)
    nodes:
      "scorpio:9090": 1
    timeout:
      connect: 5
      send: 15
      read: 15

  - id: grafana
    type: roundrobin
    # Grafana OSS của lõi (#92, profile bi). Không chạy profile bi thì route /grafana/* trả 502/503
    nodes:
      "grafana:3000": 1
    timeout:
      connect: 5
      send: 60
      read: 60

  - id: web
    type: roundrobin
    # Web Tầng 2 của ứng dụng (#64), không thuộc lõi: mặc định quy ước <DXOS_APP>-web:3000
    # (docker-compose.yml). Lõi chạy một mình (không có app) thì route /* trả 502/503.
    nodes:
      - host: "${{GW_WEB_UPSTREAM_HOST:=web}}"
        port: ${{GW_WEB_UPSTREAM_PORT:=3000}}
        weight: 1
    timeout:
      connect: 5
      send: 15
      read: 15

routes:
  # ---------------- /graphql → Hasura /v1/graphql ----------------
  # Chỉ mở đúng một endpoint GraphQL. /v1/metadata, /v2/query, /console không có route ra ngoài.
  - id: graphql
    uri: /graphql
    methods: [GET, POST, OPTIONS]
    upstream_id: hasura
    # Subscription (WebSocket) đi route graphql-ws bên dưới; route này chỉ nhận query/mutation HTTP
    plugins:
      request-id: {}
      client-control: &api-body-limit
        # Body API JSON tối đa 1 MiB (vượt → 413), khớp SecRequestBodyLimit của WAF
        max_body_size: 1048576
      serverless-pre-function: &waf-read-body
        # APISIX chỉ đưa body cho plugin wasm khi biến wasm_process_req_body khác rỗng
        # (apisix/wasm.lua); coraza-proxy-wasm viết cho Envoy nên không tự bật. Hàm này chạy
        # trước Coraza (priority 10000 > 7999) để WAF đọc được body JSON/GraphQL.
        phase: rewrite
        functions:
          - "return function(conf, ctx) ngx.var.wasm_process_req_body = 'on' end"
      coraza-filter:
        conf: &waf-api
          directives_map:
            # Bộ luật cho API JSON: đọc body (GraphQL), OWASP CRS v4 paranoia 1, chặn khi vượt ngưỡng
            api:
              - Include @recommended-conf
              - SecRuleEngine On
              - SecResponseBodyAccess Off
              - SecRequestBodyLimit 1048576
              - SecRequestBodyLimitAction Reject
              - Include @crs-setup-conf
              - Include @owasp_crs/*.conf
          default_directives: api
      cors: &cors
        allow_origins: "${{GW_CORS_ALLOW_ORIGINS:=http://localhost:3000}}"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Request-Id,X-Hasura-Role"
        expose_headers: "X-Request-Id,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset"
        max_age: 3600
      openid-connect: &oidc-pass-token
        client_id: dxos-gateway
        client_secret: $env://KC_GATEWAY_CLIENT_SECRET
        discovery: http://keycloak:8080/realms/${{KEYCLOAK_REALM:=disaster}}/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        set_userinfo_header: false
        # Chuyển nguyên Bearer token cho Hasura tự kiểm lại và đọc claim x-hasura-*
        set_access_token_header: true
        access_token_in_authorization_header: true
      proxy-rewrite:
        uri: /v1/graphql
        headers:
          remove:
            # Không cho client ngoài thử admin secret qua gateway
            - X-Hasura-Admin-Secret
      limit-count: &rate-limit
        count: ${{GW_RATE_LIMIT_COUNT:=300}}
        time_window: ${{GW_RATE_LIMIT_WINDOW:=60}}
        key_type: var
        key: remote_addr
        rejected_code: 429

  # ---------------- /graphql (WebSocket) → Hasura /v1/graphql, subscription (#60) ----------------
  # Cùng URI /graphql, chỉ khi bắt tay WebSocket (GET + Upgrade: websocket), ưu tiên hơn route trên.
  # Giao thức graphql-transport-ws (graphql-ws). Trình duyệt KHÔNG gửi được header Authorization khi mở
  # WebSocket, nên gateway không kiểm JWT ở bước bắt tay (giống /realtime/websocket, #68): JWT nằm trong
  # payload của connection_init ({"headers": {"Authorization": "Bearer …"}}) và Hasura kiểm chữ ký, iss,
  # hạn rồi áp quyền theo vai trò như với HTTP. Thiếu JWT → Hasura coi là vai anonymous, không thấy bảng
  # nào; JWT sai/hết hạn → Hasura đóng kết nối. Không có cookie nên trang lạ mở WebSocket cũng không
  # mượn được phiên. WAF kiểm bắt tay (URI, tham số, header); khung WebSocket sau bắt tay không đi qua
  # WAF (Coraza không phân tích được), nội dung là thông điệp GraphQL do Hasura kiểm theo metadata.
  # Giới hạn tần suất riêng như route realtime: mỗi lần kết nối/kết nối lại là một request.
  - id: graphql-ws
    uri: /graphql
    priority: 10
    methods: [GET]
    vars:
      - [http_upgrade, "~*", "^websocket$"]
    upstream_id: hasura
    enable_websocket: true
    plugins:
      request-id: {}
      client-control: *api-body-limit
      coraza-filter:
        conf:
          directives_map:
            graphql-ws:
              - Include @recommended-conf
              - SecRuleEngine On
              - SecRequestBodyAccess Off
              - SecResponseBodyAccess Off
              - Include @crs-setup-conf
              - Include @owasp_crs/*.conf
          default_directives: graphql-ws
      proxy-rewrite:
        uri: /v1/graphql
        headers:
          remove:
            - X-Hasura-Admin-Secret
      limit-count:
        count: ${{GW_REALTIME_RATE_LIMIT_COUNT:=60}}
        time_window: ${{GW_RATE_LIMIT_WINDOW:=60}}
        key_type: var
        key: remote_addr
        rejected_code: 429

  # Endpoint quản trị của Hasura: chặn rõ ràng từ ngoài (quản trị chỉ qua 127.0.0.1:8081)
  - id: hasura-admin-deny
    uris: [/v1/*, /v2/*, /console, /console/*, /healthz/hasura]
    plugins:
      serverless-pre-function:
        phase: rewrite
        functions:
          - "return function(conf, ctx) local core = require('apisix.core'); core.response.exit(403, {message = 'Forbidden: endpoint quản trị không mở qua gateway'}) end"

  # ---------------- /files/* → SeaweedFS S3 gateway (CHỈ ĐỌC) ----------------
  # /files/<bucket>/<key> → seaweedfs:8333/<bucket>/<key>. Gateway kiểm JWT (header Authorization)
  # rồi bỏ header này; S3 kiểm chữ ký SigV4 dạng presigned (tham số X-Amz-* trên URL).
  # Kiểm quyền THEO OBJECT (#27): gateway chỉ biết "người dùng đã đăng nhập", không biết ai được xem
  # object nào. Quyền theo object nằm ở chữ ký presigned: chỉ backend của ứng dụng giữ khóa S3, nó
  # kiểm vai trò + quyền theo hàng (Hasura) rồi mới ký URL cho ĐÚNG một object, phương thức GET, hạn
  # ngắn (mặc định 5 phút). Đổi key, đổi phương thức, hết hạn hay không có chữ ký → S3 trả 403.
  # Chỉ GET/HEAD: không có đường ghi/xóa S3 từ ngoài. Tải ảnh lên đi qua API của ứng dụng
  # (/workflow/tai-len/*), nơi kiểm loại tệp bằng magic bytes và kích thước trước khi ghi S3.
  - id: files
    uri: /files/*
    methods: [GET, HEAD, OPTIONS]
    upstream_id: seaweedfs-s3
    plugins:
      request-id: {}
      client-control:
        # Chỉ đọc nên body không cần lớn; giữ giới hạn chung để request bất thường bị 413
        max_body_size: ${{GW_FILES_MAX_BODY_BYTES:=20971520}}
      coraza-filter:
        conf:
          directives_map:
            # Tệp nhị phân: không đọc body (tránh báo nhầm và tốn RAM), vẫn kiểm URI, tham số, header.
            # Cho phép thêm PUT/DELETE và kiểu nội dung ảnh/tệp mà S3 cần.
            files:
              - Include @recommended-conf
              - SecRuleEngine On
              - SecRequestBodyAccess Off
              - SecResponseBodyAccess Off
              - Include @crs-setup-conf
              - "SecAction \"id:900200,phase:1,pass,t:none,nolog,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE'\""
              # Khối gập ">-" nối các dòng bằng một dấu cách, đúng định dạng danh sách "|a| |b|" của CRS
              - >-
                SecAction "id:900220,phase:1,pass,t:none,nolog,setvar:'tx.allowed_request_content_type=
                |application/x-www-form-urlencoded| |multipart/form-data| |application/json| |application/xml|
                |text/plain| |application/octet-stream| |image/jpeg| |image/png| |image/webp| |image/heic|
                |video/mp4| |application/pdf|'"
              - Include @owasp_crs/*.conf
          default_directives: files
      cors: *cors
      openid-connect:
        client_id: dxos-gateway
        client_secret: $env://KC_GATEWAY_CLIENT_SECRET
        discovery: http://keycloak:8080/realms/${{KEYCLOAK_REALM:=disaster}}/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        set_userinfo_header: false
        set_access_token_header: false
      proxy-rewrite:
        regex_uri: ["^/files/(.*)", "/$1"]
        headers:
          remove:
            # Header Authorization của S3 dành cho chữ ký SigV4, không chuyển JWT sang S3
            - Authorization
      limit-count: *rate-limit

  # ---------------- /workflow/tai-len/* → API của ứng dụng, tải tệp nhị phân (#27) ----------------
  # Quy ước của lõi: đường dẫn /tai-len/... của API ứng dụng nhận body nhị phân (ảnh hiện trường),
  # lớn hơn giới hạn 1 MiB của API JSON. Ưu tiên hơn route /workflow/* (priority). Gateway kiểm JWT,
  # WAF (không đọc body nhị phân, vẫn kiểm URI/tham số/header), giới hạn body GW_UPLOAD_MAX_BODY_BYTES
  # (vượt → 413) rồi chuyển nguyên Bearer token; API kiểm lại JWT, quyền, magic bytes, giới hạn riêng.
  - id: workflow-upload
    uri: /workflow/tai-len/*
    priority: 10
    methods: [POST, OPTIONS]
    upstream_id: workflow-api
    plugins:
      request-id: {}
      client-control:
        max_body_size: ${{GW_UPLOAD_MAX_BODY_BYTES:=20971520}}
      coraza-filter:
        conf:
          directives_map:
            upload:
              - Include @recommended-conf
              - SecRuleEngine On
              - SecRequestBodyAccess Off
              - SecResponseBodyAccess Off
              - Include @crs-setup-conf
              # Kiểu nội dung client khai báo chỉ để qua WAF; API không tin, tự kiểm magic bytes
              - >-
                SecAction "id:900220,phase:1,pass,t:none,nolog,setvar:'tx.allowed_request_content_type=
                |application/octet-stream| |image/jpeg| |image/png| |image/webp|'"
              - Include @owasp_crs/*.conf
          default_directives: upload
      cors: *cors
      openid-connect: *oidc-pass-token
      proxy-rewrite:
        regex_uri: ["^/workflow/(.*)", "/$1"]
      limit-count: *rate-limit

  # ---------------- /workflow/minh-bach/* → trang công khai của ứng dụng (#28) ----------------
  # Quy ước của lõi: đường /minh-bach/... của API ứng dụng là đường CÔNG KHAI, CHỈ ĐỌC (không cần
  # đăng nhập), dành cho trang "Minh bạch cứu trợ": người dân tra mã phiếu, API trả bản ghi không định
  # danh + trạng thái xác minh trên sổ cái. Ưu tiên hơn /workflow/* (priority). Không kiểm JWT; bỏ
  # header Authorization (API không nhận token ở đường này); WAF + giới hạn tần suất như route API.
  - id: workflow-public
    uri: /workflow/minh-bach/*
    priority: 10
    methods: [GET, OPTIONS]
    upstream_id: workflow-api
    plugins:
      request-id: {}
      client-control: *api-body-limit
      coraza-filter:
        conf: *waf-api
      cors: *cors
      proxy-rewrite:
        regex_uri: ["^/workflow/(.*)", "/$1"]
        headers:
          remove:
            - Authorization
      limit-count: *rate-limit

  # ---------------- /workflow/keu-cuu → tiếp nhận tin kêu cứu của ứng dụng (#66) ----------------
  # Quy ước của lõi: đường POST /keu-cuu của API ứng dụng là đường người ngoài hiện trường gửi tin (dễ bị
  # spam nhất), nên có giới hạn tần suất RIÊNG, chặt hơn route API chung (GW_KEU_CUU_RATE_LIMIT_COUNT
  # request / GW_RATE_LIMIT_WINDOW giây / IP, đếm riêng route này). Ưu tiên hơn /workflow/* (priority).
  # Còn lại như route /workflow/*: JWT bắt buộc (không mở gửi ẩn danh), WAF đọc body JSON, body ≤ 1 MiB
  # (API còn giới hạn riêng 16 KiB). API kiểm lại JWT, vai trò, dữ liệu; CSDL chặn tin trùng.
  - id: workflow-keu-cuu
    uri: /workflow/keu-cuu
    priority: 10
    methods: [POST, OPTIONS]
    upstream_id: workflow-api
    plugins:
      request-id: {}
      client-control: *api-body-limit
      serverless-pre-function: *waf-read-body
      coraza-filter:
        conf: *waf-api
      cors: *cors
      openid-connect: *oidc-pass-token
      proxy-rewrite:
        regex_uri: ["^/workflow/(.*)", "/$1"]
      limit-count:
        count: ${{GW_KEU_CUU_RATE_LIMIT_COUNT:=20}}
        time_window: ${{GW_RATE_LIMIT_WINDOW:=60}}
        key_type: var
        key: remote_addr
        rejected_code: 429

  # ---------------- /ledger/* → sổ cái minh bạch (#28), CHỈ ĐỌC, công khai ----------------
  # tlog-tiles (C2SP): /ledger/checkpoint (đã ký Ed25519), /ledger/tile/... (tile hash + entry bundle),
  # /ledger/proof/{index} (inclusion proof), /ledger/verifier (khóa công khai). Ai cũng tải về tự kiểm
  # được (core/ledger/cmd/ledger-verify). Không cần đăng nhập: lá không chứa dữ liệu cá nhân (D-007).
  - id: ledger-read
    uri: /ledger/*
    methods: [GET, HEAD, OPTIONS]
    upstream_id: ledger
    plugins:
      request-id: {}
      client-control: *api-body-limit
      coraza-filter:
        conf: *waf-api
      cors: *cors
      proxy-rewrite:
        headers:
          remove:
            - Authorization
      limit-count: *rate-limit

  # Ghi sổ cái (POST /ledger/entries) KHÔNG đi qua gateway: chỉ dịch vụ trong mạng nội bộ có token
  # ghi (core/ledger). Mọi phương thức ghi từ ngoài bị chặn rõ ràng ở đây.
  - id: ledger-write-deny
    uri: /ledger/*
    methods: [POST, PUT, PATCH, DELETE]
    plugins:
      serverless-pre-function:
        phase: rewrite
        functions:
          - "return function(conf, ctx) local core = require('apisix.core'); core.response.exit(403, {message = 'Forbidden: ghi sổ cái chỉ từ dịch vụ nội bộ'}) end"

  # ---------------- /ngsi-ld/v1/* → Scorpio NGSI-LD (#85), chỉ đọc ----------------
  # Bản sao số trạm đo: GET thực thể, kiểu, thuộc tính (NGSI-LD API 1.x của ETSI). Bắt buộc JWT (mọi vai trò
  # đã đăng nhập; dữ liệu trạm không định danh), WAF kiểm URI/tham số (q=, georel=, coordinates=), rate limit.
  # Gateway ĐẶT header Link tới @context của ứng dụng (GW_NGSI_LD_CONTEXT_URL, mặc định
  # <DXOS_APP>-api:8000/ngsi-ld/context.jsonld, chỉ trong mạng nội bộ) và bỏ Link của client: client dùng
  # tên ngắn (type=WaterLevelStation, waterLevel…) mà không phải biết URL context, và Scorpio không bị dùng
  # để tải URL tùy ý (SSRF). Bỏ NGSILD-Tenant: chỉ dùng tenant mặc định. Accept: application/geo+json trả
  # GeoJSON FeatureCollection cho bản đồ. Không mở: jsonldContexts, subscriptions, csourceRegistrations,
  # entityOperations, temporal, /q/* (route ngsi-ld-deny bên dưới trả 403).
  - id: ngsi-ld
    uris:
      - /ngsi-ld/v1/entities
      - /ngsi-ld/v1/entities/*
      - /ngsi-ld/v1/types
      - /ngsi-ld/v1/types/*
      - /ngsi-ld/v1/attributes
      - /ngsi-ld/v1/attributes/*
    methods: [GET, HEAD, OPTIONS]
    priority: 10
    upstream_id: scorpio
    plugins:
      request-id: {}
      client-control: *api-body-limit
      coraza-filter:
        conf: *waf-api
      cors: *cors
      openid-connect:
        client_id: dxos-gateway
        client_secret: $env://KC_GATEWAY_CLIENT_SECRET
        discovery: http://keycloak:8080/realms/${{KEYCLOAK_REALM:=disaster}}/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        set_userinfo_header: false
        # Scorpio không đọc token: không chuyển tiếp (proxy-rewrite bỏ cả header Authorization)
        set_access_token_header: false
      proxy-rewrite:
        headers:
          set:
            Link: '<${{GW_NGSI_LD_CONTEXT_URL:=http://workflow-api:8000/ngsi-ld/context.jsonld}}>; rel="http://www.w3.org/ns/json-ld#context"; type="application/ld+json"'
          remove:
            - Authorization
            - NGSILD-Tenant
      limit-count: *rate-limit

  - id: ngsi-ld-deny
    uri: /ngsi-ld/*
    plugins:
      serverless-pre-function:
        phase: rewrite
        functions:
          - "return function(conf, ctx) local core = require('apisix.core'); core.response.exit(403, {message = 'Forbidden: NGSI-LD qua gateway chỉ đọc entities/types/attributes'}) end"

  # ---------------- /workflow/* → API workflow của ứng dụng (#29) ----------------
  # /workflow/<đường dẫn> → <app>-api:8000/<đường dẫn>. Gateway kiểm JWT + WAF + rate limit rồi chuyển
  # nguyên Bearer token: API kiểm lại chữ ký và đọc vai trò (vd chỉ dieu-phoi được khởi chạy phân công).
  # Endpoint: apps/cuu-tro/README.md mục "Workflow".
  - id: workflow
    uri: /workflow/*
    methods: [GET, POST, OPTIONS]
    upstream_id: workflow-api
    plugins:
      request-id: {}
      client-control: *api-body-limit
      serverless-pre-function: *waf-read-body
      coraza-filter:
        conf: *waf-api
      cors: *cors
      openid-connect: *oidc-pass-token
      proxy-rewrite:
        regex_uri: ["^/workflow/(.*)", "/$1"]
      limit-count: *rate-limit

  # ---------------- /realtime/websocket → Centrifugo (#68), WebSocket ----------------
  # Đúng một đường: /realtime/websocket → centrifugo:8000/connection/websocket. Không kiểm JWT ở gateway:
  # trình duyệt không gửi được header Authorization khi mở WebSocket. Xác thực nằm trong lệnh connect
  # đầu tiên (token ngắn hạn do API ứng dụng cấp qua /workflow/realtime/token, đã kiểm JWT + vai trò);
  # Centrifugo kiểm chữ ký, iss, aud, hạn và Origin (CENTRIFUGO_CLIENT_ALLOWED_ORIGINS). Chỉ GET (bắt
  # tay). WAF kiểm bắt tay (URI, tham số, header) như route web; khung WebSocket sau bắt tay không đi
  # qua WAF (Coraza không phân tích được), nội dung client gửi chỉ là lệnh giao thức Centrifugo.
  # Giới hạn tần suất riêng: mỗi lần kết nối/kết nối lại là một request.
  - id: realtime
    uri: /realtime/websocket
    methods: [GET]
    upstream_id: centrifugo
    enable_websocket: true
    plugins:
      request-id: {}
      client-control: *api-body-limit
      coraza-filter:
        conf:
          directives_map:
            realtime:
              - Include @recommended-conf
              - SecRuleEngine On
              - SecRequestBodyAccess Off
              - SecResponseBodyAccess Off
              - Include @crs-setup-conf
              - Include @owasp_crs/*.conf
          default_directives: realtime
      proxy-rewrite:
        uri: /connection/websocket
        headers:
          remove:
            - Authorization
      limit-count:
        count: ${{GW_REALTIME_RATE_LIMIT_COUNT:=60}}
        time_window: ${{GW_RATE_LIMIT_WINDOW:=60}}
        key_type: var
        key: remote_addr
        rejected_code: 429

  # ---------------- /api/v1/me (route mẫu v0.0.1) ----------------
  # Trả thông tin người dùng từ token (Keycloak userinfo). Không token / token sai → 401.
  - id: api-me
    uri: /api/v1/me
    methods: [GET, OPTIONS]
    upstream_id: keycloak
    plugins:
      request-id: {}
      client-control: *api-body-limit
      serverless-pre-function: *waf-read-body
      coraza-filter:
        conf: *waf-api
      cors: *cors
      openid-connect: *oidc-pass-token
      proxy-rewrite:
        uri: /realms/${{KEYCLOAK_REALM:=disaster}}/protocol/openid-connect/userinfo
      limit-count: *rate-limit

  # ---------------- /grafana/* → Grafana OSS (#92, profile bi) ----------------
  # Dashboard điều hành cho người vận hành. Không kiểm JWT ở gateway: Grafana tự đăng nhập (tài khoản admin,
  # mật khẩu trong OpenBao; không đăng ký, không ẩn danh) và tự bảo vệ phiên (cookie SameSite strict).
  # Grafana phục vụ dưới đường /grafana/ (GF_SERVER_SERVE_FROM_SUB_PATH). WAF kiểm URI, tham số, header nhưng
  # KHÔNG đọc body: truy vấn của panel (POST /grafana/api/ds/query) mang SQL trong body, luật SQLi của CRS sẽ
  # chặn nhầm; SQL chạy bằng role chỉ đọc <schema>_bi nên có giới hạn ở CSDL. WebSocket cho Grafana Live.
  # Giới hạn tần suất như route web (một lần mở dashboard tải nhiều tệp + truy vấn).
  - id: grafana
    uris: [/grafana, /grafana/*]
    priority: 10
    methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
    upstream_id: grafana
    enable_websocket: true
    plugins:
      request-id: {}
      client-control:
        max_body_size: 1048576
      coraza-filter:
        conf:
          directives_map:
            grafana:
              - Include @recommended-conf
              - SecRuleEngine On
              - SecRequestBodyAccess Off
              - SecResponseBodyAccess Off
              - Include @crs-setup-conf
              - Include @owasp_crs/*.conf
          default_directives: grafana
      proxy-rewrite:
        headers:
          remove:
            # Giữ Authorization (đăng nhập API của Grafana); bỏ header auth-proxy để không ai giả danh người dùng
            - X-WEBAUTH-USER
      limit-count:
        count: ${{GW_WEB_RATE_LIMIT_COUNT:=600}}
        time_window: ${{GW_RATE_LIMIT_WINDOW:=60}}
        key_type: var
        key: remote_addr
        rejected_code: 429

  # ---------------- /* → web Tầng 2 của ứng dụng (#64), CHỈ GET/HEAD ----------------
  # Trang web (SPA) và tệp tĩnh: /, /auth/callback, /_nuxt/*, /logo/*... Mọi route khác có đường dẫn
  # cụ thể hơn nên luôn thắng (/graphql, /files/*, /workflow/*, /ledger/*, /realtime/websocket, /api/v1/me, /healthz, chặn
  # /v1/*, /v2/*, /console); route này chỉ nhận GET/HEAD nên PUT/DELETE /files/* vẫn 404.
  # Không kiểm JWT ở gateway: web tự đăng nhập Keycloak (OIDC + PKCE) rồi gọi API qua các route trên
  # kèm Bearer token. WAF vẫn bật (URI, tham số, header); bỏ header Authorization (web không cần token).
  # Header bảo mật (CSP, X-Frame-Options, nosniff) do web đặt (apps/<app>/web/server/plugins).
  - id: web
    uris: [/, /*]
    priority: -10
    methods: [GET, HEAD]
    upstream_id: web
    plugins:
      request-id: {}
      client-control: *api-body-limit
      coraza-filter:
        conf:
          directives_map:
            web:
              - Include @recommended-conf
              - SecRuleEngine On
              - SecRequestBodyAccess Off
              - SecResponseBodyAccess Off
              - Include @crs-setup-conf
              - Include @owasp_crs/*.conf
              # Keycloak gọi lại /auth/callback kèm iss=<URL realm> (RFC 9207), vd http://localhost:8080/...
              # hay http://<IP>:8080/...: luật SSRF (934110) và RFI (931100) chặn nhầm. Chỉ bỏ hai nhóm
              # luật này cho đúng tham số iss; luật XSS/SQLi vẫn kiểm iss
              - SecRuleUpdateTargetByTag "attack-ssrf" "!ARGS:iss"
              - SecRuleUpdateTargetByTag "attack-rfi" "!ARGS:iss"
          default_directives: web
      proxy-rewrite:
        headers:
          remove:
            - Authorization
      limit-count:
        # Một lần mở trang tải khoảng 10-20 tệp: giới hạn riêng, cao hơn route API
        count: ${{GW_WEB_RATE_LIMIT_COUNT:=600}}
        time_window: ${{GW_RATE_LIMIT_WINDOW:=60}}
        key_type: var
        key: remote_addr
        rejected_code: 429

  # Kiểm tra sống của gateway, không cần token. Giới hạn chặt (20 request / 10 giây / IP)
  # để smoke test kiểm được limit-count mà không phải chờ lâu.
  - id: health
    uri: /healthz
    methods: [GET]
    plugins:
      limit-count:
        count: 20
        time_window: 10
        key_type: var
        key: remote_addr
        rejected_code: 429
      serverless-post-function:
        # Pha access, sau limit-count: vượt giới hạn thì 429 trước khi trả 200
        phase: access
        functions:
          - "return function(conf, ctx) local core = require('apisix.core'); core.response.exit(200, {status = 'ok'}) end"
