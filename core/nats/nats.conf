# NATS JetStream + MQTT của lõi (profile core, #11, #30). Lõi không biết subject/topic nghiệp vụ nào:
# người dùng, mật khẩu và phạm vi subject (<DXOS_APP>.>) nằm trong secrets/auth.conf do
# bao-agent-nats render từ OpenBao (core/openbao/agent-nats.hcl). Không có no_auth_user: kết nối
# không có thông tin xác thực (NATS lẫn MQTT) bị từ chối.
server_name: dxos-nats
port: 4222
# Cổng giám sát chỉ dùng trong mạng compose (healthcheck, smoke), không công bố ra máy host
http_port: 8222
max_payload: 1MB

# Giới hạn cho laptop; biến môi trường đặt trong docker-compose.yml (mặc định 64MB / 1GB).
# Stream của ứng dụng tự đặt giới hạn riêng nhỏ hơn (vd apps/cuu-tro/nats/streams.json).
jetstream {
  store_dir: /data
  max_memory_store: $NATS_JS_MAX_MEMORY
  max_file_store: $NATS_JS_MAX_FILE
}

include secrets/auth.conf

# MQTT 3.1.1 cho thiết bị/giả lập: topic a/b/c ↔ subject a.b.c. Xác thực bằng user/mật khẩu trong
# gói CONNECT, đối chiếu với authorization ở trên. Chưa có TLS (việc sau, trước khi mở ra mạng ngoài).
mqtt {
  port: 1883
  # Thiết bị cảm biến chỉ gửi QoS 0/1; QoS 2 tốn thêm trạng thái trên JetStream
  reject_qos2_publish: true
  ack_wait: 30s
  max_ack_pending: 100
}
