# SPDX-License-Identifier: Apache-2.0
# Disaster DX-OS — lõi headless Tầng 1. Kiến trúc: docs/architecture.md
#
# Cấu hình lõi (không chứa nghiệp vụ) nằm trong core/. Ứng dụng Tầng 2 cắm vào lõi
# nằm trong apps/<tên>/, chọn bằng biến DXOS_APP (mặc định: cuu-tro).
#
# Profile:
#   core   OpenBao, PostgreSQL+PostGIS, Keycloak, APISIX, Hasura CE, SeaweedFS, Temporal, NATS
#          (JetStream + MQTT có xác thực, #30), sổ cái minh bạch ledger (Tessera, #28),
#          Centrifugo OSS đẩy thông báo realtime qua WebSocket (#68),
#          Scorpio NGSI-LD broker cho bản sao số trạm đo (#85; trước đây dự kiến ở profile gis)
#          (chạy được trên laptop 16 GB, RAM đo được: docs/architecture.md mục 4)
#   app    backend và web của ứng dụng Tầng 2 đang chọn (apps/${DXOS_APP}/compose.yaml, nạp bằng include
#          bên dưới), vd cuu-tro-worker, cuu-tro-api (#29), cuu-tro-web (#64). make up bật cả core và app.
#   bi     Grafana OSS (AGPL-3.0, dịch vụ riêng) dashboard điều hành (#92): make up-bi
#   ai     Ollama (MIT, dịch vụ riêng) chạy mô hình mở cho AI bóc tách tin kêu cứu (#102): make up-ai.
#          Không bật thì ứng dụng dùng LLM_PROVIDER=gia-lap (bộ luật) hoặc API ngoài openai-compatible
#   sec    ClamAV (GPL-2.0, dịch vụ riêng) quét mã độc tệp tải lên (#111): make up-sec. Không bật thì ứng dụng
#          vẫn nhận tệp với trạng thái "chưa quét" (hoặc từ chối nếu ứng dụng bắt buộc quét)
#
# Chạy: cp .env.example .env && make up   (make up tự khởi tạo/mở khóa OpenBao lần đầu)
# Bí mật của dịch vụ lõi nằm trong OpenBao, không nằm trong .env (#14). bao agent render
# thành file trên volume tmpfs, core/openbao/env-from-files.sh export trước khi chạy dịch vụ.
# Quy tắc: mọi image ghim phiên bản cụ thể, lấy từ nguồn gốc, KHÔNG dùng "latest".

name: ${COMPOSE_PROJECT_NAME:-disaster-dxos}

# Dịch vụ backend của ứng dụng Tầng 2 nằm trong thư mục ứng dụng, không nằm trong file lõi này (#29).
# Quy ước: mỗi apps/<tên>/ có compose.yaml (có thể chỉ "services: {}"); dịch vụ của nó dùng profile
# "app", được dùng volume/dịch vụ của lõi. project_directory "." để đường dẫn tương đối và .env tính
# từ gốc repo như file này.
include:
  - path: apps/${DXOS_APP:-cuu-tro}/compose.yaml
    project_directory: .

x-restart: &restart
  restart: unless-stopped

# Một bao agent cho mỗi dịch vụ đọc bí mật: mỗi agent có AppRole + policy chỉ đọc riêng
x-bao-agent: &bao-agent
  <<: *restart
  image: openbao/openbao:2.7.1
  profiles: [core]
  depends_on:
    openbao:
      condition: service_healthy
  mem_limit: 64m

# Volume tmpfs chứa bí mật đã render: nằm trong RAM, mất khi dừng container
x-secrets-tmpfs: &secrets-tmpfs
  driver: local
  driver_opts:
    type: tmpfs
    device: tmpfs
    # uid/gid của user openbao trong image (agent ghi); dịch vụ chỉ mount read-only
    o: "uid=100,gid=1000,mode=0755,size=1m"

services:
  # ======================= profile: core =======================
  openbao:
    <<: *restart
    # Chế độ server, lưu trữ raft trên volume baodata. Khởi động ở trạng thái sealed:
    # make bao-init (lần đầu) hoặc openbao-unseal (dev) / make bao-unseal (thủ công).
    image: openbao/openbao:2.7.1
    profiles: [core]
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./core/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - baodata:/openbao/file
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"
    healthcheck:
      # bao status: 0 = đã mở khóa; 2 = sealed/chưa init → unhealthy, dịch vụ phụ thuộc chờ
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 256m

  openbao-unseal:
    # CHỈ DÙNG CHO DEV: tự mở khóa sau khi khởi động lại bằng key trong ${OPENBAO_LOCAL_DIR}/unseal.
    # Tắt: OPENBAO_DEV_AUTO_UNSEAL=false (bắt buộc trên VPS). Xem core/openbao/dev-auto-unseal.sh
    restart: on-failure
    image: openbao/openbao:2.7.1
    profiles: [core]
    entrypoint: ["/bin/sh", "/opt/dxos/dev-auto-unseal.sh"]
    depends_on:
      - openbao
    environment:
      BAO_ADDR: http://openbao:8200
      OPENBAO_DEV_AUTO_UNSEAL: ${OPENBAO_DEV_AUTO_UNSEAL:-false}
    volumes:
      - ./core/openbao/dev-auto-unseal.sh:/opt/dxos/dev-auto-unseal.sh:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/unseal:/openbao/unseal:ro
    mem_limit: 64m

  bao-agent-keycloak:
    <<: *bao-agent
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    volumes:
      - ./core/openbao/agent-keycloak.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/keycloak:/openbao/approle:ro
      - secrets-keycloak:/out/keycloak
    healthcheck:
      test: ["CMD-SHELL", "test -s /out/keycloak/KC_DB_PASSWORD && test -s /out/keycloak/KC_GATEWAY_CLIENT_SECRET"]
      interval: 5s
      timeout: 3s
      retries: 24

  bao-agent-apisix:
    <<: *bao-agent
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    volumes:
      - ./core/openbao/agent-apisix.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/apisix:/openbao/approle:ro
      - secrets-apisix:/out/apisix
    healthcheck:
      test: ["CMD-SHELL", "test -s /out/apisix/KC_GATEWAY_CLIENT_SECRET"]
      interval: 5s
      timeout: 3s
      retries: 24

  bao-agent-postgres:
    <<: *bao-agent
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    volumes:
      - ./core/openbao/agent-postgres.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/postgres:/openbao/approle:ro
      - secrets-postgres:/out/postgres
    environment:
      # Chọn secret/app/<DXOS_APP>/db trong template APP_DB_PASSWORD (agent-postgres.hcl)
      DXOS_APP: ${DXOS_APP:-cuu-tro}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          for f in POSTGRES_PASSWORD KEYCLOAK_DB_PASSWORD HASURA_DB_PASSWORD TEMPORAL_DB_PASSWORD SCORPIO_DB_PASSWORD
          APP_DB_PASSWORD APP_BI_DB_PASSWORD; do test -s /out/postgres/$$f || exit 1; done
      interval: 5s
      timeout: 3s
      retries: 24

  bao-agent-hasura:
    <<: *bao-agent
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    environment:
      # Dùng trong template agent-hasura.hcl để ghép HASURA_GRAPHQL_DATABASE_URL
      HASURA_DB_USER: ${HASURA_DB_USER:-hasura}
      POSTGRES_DB: ${POSTGRES_DB:-disaster}
    volumes:
      - ./core/openbao/agent-hasura.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/hasura:/openbao/approle:ro
      - secrets-hasura:/out/hasura
    healthcheck:
      test: ["CMD-SHELL", "test -s /out/hasura/HASURA_GRAPHQL_DATABASE_URL && test -s /out/hasura/HASURA_GRAPHQL_ADMIN_SECRET"]
      interval: 5s
      timeout: 3s
      retries: 24

  bao-agent-temporal:
    <<: *bao-agent
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    volumes:
      - ./core/openbao/agent-temporal.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/temporal:/openbao/approle:ro
      - secrets-temporal:/out/temporal
    healthcheck:
      test: ["CMD-SHELL", "test -s /out/temporal/POSTGRES_PWD"]
      interval: 5s
      timeout: 3s
      retries: 24

  bao-agent-seaweedfs:
    <<: *bao-agent
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    volumes:
      - ./core/openbao/agent-seaweedfs.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/seaweedfs:/openbao/approle:ro
      - secrets-seaweedfs:/out/seaweedfs
    environment:
      # Chọn secret/app/<DXOS_APP>/s3 và tên định danh/tiền tố bucket của ứng dụng (#27)
      DXOS_APP: ${DXOS_APP:-cuu-tro}
    healthcheck:
      # Cả định danh lõi lẫn định danh của ứng dụng đã render
      test: ["CMD-SHELL", "grep -q dxos-core /out/seaweedfs/s3.json && grep -q \"$${DXOS_APP}-app\" /out/seaweedfs/s3.json"]
      interval: 5s
      timeout: 3s
      retries: 24

  postgres:
    <<: *restart
    image: postgis/postgis:17-3.5
    platform: ${POSTGIS_PLATFORM:-linux/amd64}
    profiles: [core]
    # POSTGRES_PASSWORD (superuser) và KEYCLOAK_DB_PASSWORD lấy từ OpenBao qua bao-agent-postgres.
    # Cả hai chỉ có tác dụng ở lần initdb đầu (volume pgdata trống); sau đó postgres-roles đồng bộ.
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos", "docker-entrypoint.sh"]
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    depends_on:
      bao-agent-postgres:
        condition: service_healthy
    environment:
      SECRETS_REQUIRED: POSTGRES_PASSWORD KEYCLOAK_DB_PASSWORD
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-disaster}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - secrets-postgres:/run/secrets/dxos:ro
      - ./core/postgres/init/20-create-databases.sh:/docker-entrypoint-initdb.d/20-create-databases.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      # Kiểm qua TCP: lúc initdb trên volume trống, server tạm của docker-entrypoint chỉ nghe Unix socket rồi
      # tắt để khởi động lại; kiểm qua socket sẽ báo healthy quá sớm và postgres-roles bị từ chối kết nối
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g

  postgres-roles:
    # Chạy một lần mỗi lần up: tạo/đồng bộ role keycloak, hasura, temporal, scorpio (không dịch vụ nào dùng
    # superuser). Dùng lại image postgis, không kéo thêm image. Script: core/postgres/sync-roles.sh
    image: postgis/postgis:17-3.5
    platform: ${POSTGIS_PLATFORM:-linux/amd64}
    profiles: [core]
    restart: "no"
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos", "bash", "/opt/dxos/sync-roles.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRETS_REQUIRED: POSTGRES_PASSWORD KEYCLOAK_DB_PASSWORD HASURA_DB_PASSWORD TEMPORAL_DB_PASSWORD SCORPIO_DB_PASSWORD APP_DB_PASSWORD APP_BI_DB_PASSWORD
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-disaster}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      HASURA_DB_USER: ${HASURA_DB_USER:-hasura}
      TEMPORAL_DB_USER: ${TEMPORAL_DB_USER:-temporal}
      SCORPIO_DB: ${SCORPIO_DB:-scorpio}
      SCORPIO_DB_USER: ${SCORPIO_DB_USER:-scorpio}
      # Role dịch vụ của ứng dụng: <DXOS_APP đổi - thành _>_app (cuu_tro_app), chưa có quyền gì (#29)
      DXOS_APP: ${DXOS_APP:-cuu-tro}
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - ./core/postgres/sync-roles.sh:/opt/dxos/sync-roles.sh:ro
      - secrets-postgres:/run/secrets/dxos:ro
    mem_limit: 128m

  migrate:
    # Chạy một lần mỗi lần up, sau postgres-roles: áp migration SQL của ứng dụng đang chọn
    # (apps/${DXOS_APP}/db/migrations) vào schema riêng của ứng dụng (#25). Lõi chỉ biết quy ước
    # thư mục, không biết bảng nào. Chạy lại không lỗi (lịch sử + checksum ở dxos_meta).
    # Seed: make seed · kiểm thử ràng buộc: make test-db. Script: core/postgres/migrate.sh
    image: postgis/postgis:17-3.5
    platform: ${POSTGIS_PLATFORM:-linux/amd64}
    profiles: [core]
    restart: "no"
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos", "bash", "/opt/dxos/migrate.sh"]
    command: ["migrate"]
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
    environment:
      SECRETS_REQUIRED: POSTGRES_PASSWORD
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-disaster}
      DXOS_APP: ${DXOS_APP:-cuu-tro}
      HASURA_DB_USER: ${HASURA_DB_USER:-hasura}
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - ./core/postgres/migrate.sh:/opt/dxos/migrate.sh:ro
      - ./apps/${DXOS_APP:-cuu-tro}/db:/opt/dxos/app-db:ro
      - secrets-postgres:/run/secrets/dxos:ro
    mem_limit: 128m

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [core]
    # KC_DB_PASSWORD, KC_BOOTSTRAP_ADMIN_PASSWORD, KC_GATEWAY_CLIENT_SECRET lấy từ OpenBao
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos", "/opt/keycloak/bin/kc.sh"]
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
      bao-agent-keycloak:
        condition: service_healthy
    environment:
      SECRETS_REQUIRED: KC_DB_PASSWORD KC_BOOTSTRAP_ADMIN_PASSWORD KC_GATEWAY_CLIENT_SECRET
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      # "iss" của token luôn là URL công khai; URL nội bộ (jwks, token) theo host gọi tới
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      # Giá trị thay vào placeholder ${...} trong apps/<app>/keycloak/realm.json khi import
      # (KC_GATEWAY_CLIENT_SECRET đến từ OpenBao; mật khẩu user mẫu là dữ liệu giả của ứng dụng)
      KC_DEMO_USER_PASSWORD: ${KC_DEMO_USER_PASSWORD:?Thiếu KC_DEMO_USER_PASSWORD trong .env}
      KC_REALM_SSL_REQUIRED: ${KC_REALM_SSL_REQUIRED:-external}
      # Web Tầng 2 mở qua gateway (#64): redirect_uri/web origin của client web trong realm
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:9080}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
    volumes:
      # Realm (vai trò, client, người dùng mẫu) do ứng dụng cung cấp, không thuộc lõi
      - ./apps/${DXOS_APP:-cuu-tro}/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - secrets-keycloak:/run/secrets/dxos:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      # Image Keycloak không có curl: gọi /health/ready ở cổng quản trị 9000 bằng bash (/dev/tcp)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 1536m

  apisix:
    <<: *restart
    # Image gốc apache/apisix:3.19.0-debian + coraza-proxy-wasm 0.6.0 (OWASP CRS v4), kiểm SHA-256
    # lúc build (core/apisix/Dockerfile, #12). Tên image cục bộ, không đẩy lên registry.
    build:
      context: ./core/apisix
    image: disaster-dxos/apisix:3.19.0-coraza0.6.0
    profiles: [core]
    # KC_GATEWAY_CLIENT_SECRET lấy từ OpenBao (secret/core/gateway) qua bao-agent-apisix
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos", "/docker-entrypoint.sh"]
    command: ["docker-start"]
    depends_on:
      keycloak:
        condition: service_healthy
      bao-agent-apisix:
        condition: service_healthy
    environment:
      SECRETS_REQUIRED: KC_GATEWAY_CLIENT_SECRET
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-disaster}
      # CORS cho web Tầng 2 (danh sách origin cách nhau bởi dấu phẩy) và rate limit theo IP (#12)
      GW_CORS_ALLOW_ORIGINS: ${GW_CORS_ALLOW_ORIGINS:-http://localhost:3000}
      GW_RATE_LIMIT_COUNT: ${GW_RATE_LIMIT_COUNT:-300}
      GW_RATE_LIMIT_WINDOW: ${GW_RATE_LIMIT_WINDOW:-60}
      GW_FILES_MAX_BODY_BYTES: ${GW_FILES_MAX_BODY_BYTES:-20971520}
      # Route /workflow/tai-len/* (#27): tải tệp nhị phân lên API của ứng dụng, giới hạn body riêng
      GW_UPLOAD_MAX_BODY_BYTES: ${GW_UPLOAD_MAX_BODY_BYTES:-20971520}
      # Upstream của route /workflow/*: API workflow của ứng dụng Tầng 2 (#29). Mặc định theo quy
      # ước <DXOS_APP>-api:8000 (cuu-tro-api trong apps/cuu-tro/compose.yaml); lõi không gắn cứng tên.
      GW_WORKFLOW_UPSTREAM_HOST: ${GW_WORKFLOW_UPSTREAM_HOST:-${DXOS_APP:-cuu-tro}-api}
      GW_WORKFLOW_UPSTREAM_PORT: ${GW_WORKFLOW_UPSTREAM_PORT:-8000}
      # Upstream của route /* (web Tầng 2, #64): quy ước <DXOS_APP>-web:3000 (cuu-tro-web)
      GW_WEB_UPSTREAM_HOST: ${GW_WEB_UPSTREAM_HOST:-${DXOS_APP:-cuu-tro}-web}
      GW_WEB_UPSTREAM_PORT: ${GW_WEB_UPSTREAM_PORT:-3000}
      GW_WEB_RATE_LIMIT_COUNT: ${GW_WEB_RATE_LIMIT_COUNT:-600}
      # Route /realtime/websocket (#68): số lần mở WebSocket / GW_RATE_LIMIT_WINDOW giây / IP
      GW_REALTIME_RATE_LIMIT_COUNT: ${GW_REALTIME_RATE_LIMIT_COUNT:-60}
      # Route /workflow/keu-cuu (#66): tạo tin kêu cứu / GW_RATE_LIMIT_WINDOW giây / IP, chống spam
      GW_KEU_CUU_RATE_LIMIT_COUNT: ${GW_KEU_CUU_RATE_LIMIT_COUNT:-20}
      # Route /workflow/ai/* (#102): gọi mô hình AI tốn CPU/RAM / GW_RATE_LIMIT_WINDOW giây / IP
      GW_AI_RATE_LIMIT_COUNT: ${GW_AI_RATE_LIMIT_COUNT:-30}
      # Thời hạn chờ API của route /workflow/ai/* (giây), phải lớn hơn LLM_TIMEOUT_GIAY của ứng dụng
      GW_AI_TIMEOUT_GIAY: ${GW_AI_TIMEOUT_GIAY:-150}
      # Route /ngsi-ld/v1/* (#85): URL @context NGSI-LD của ứng dụng mà gateway đặt vào header Link (Scorpio tải
      # trong mạng nội bộ). Quy ước <DXOS_APP>-api:8000/ngsi-ld/context.jsonld (cuu-tro-api)
      GW_NGSI_LD_CONTEXT_URL: ${GW_NGSI_LD_CONTEXT_URL:-http://${DXOS_APP:-cuu-tro}-api:8000/ngsi-ld/context.jsonld}
    volumes:
      - ./core/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./core/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - secrets-apisix:/run/secrets/dxos:ro
    ports:
      - "${APISIX_PORT:-9080}:9080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Coraza + OWASP CRS nạp trong mỗi worker nginx: đo ~240 MB lúc khởi động, ~370 MB sau smoke + 560 request
    mem_limit: 768m

  hasura:
    <<: *restart
    # BẮT BUỘC tag -ce (D-004): image không có -ce kèm thành phần EE độc quyền.
    # Bản cli-migrations-v3 (cùng phiên bản, cùng -ce) có thêm hasura-cli và docker-entrypoint.sh:
    # khởi động một server tạm chỉ bật metadata API, chạy "hasura-cli metadata apply" với thư mục
    # metadata của ứng dụng (apps/${DXOS_APP}/hasura/metadata, #26), rồi exec server thật.
    # Migration SQL KHÔNG đi đường này (không có /hasura-migrations): container migrate làm trước.
    image: hasura/graphql-engine:v2.51.0-ce.cli-migrations-v3
    profiles: [core]
    # HASURA_GRAPHQL_DATABASE_URL (role hasura, không phải superuser) và HASURA_GRAPHQL_ADMIN_SECRET
    # lấy từ OpenBao qua bao-agent-hasura. Tầng 2 gọi qua APISIX /graphql (#12), không gọi thẳng.
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos", "docker-entrypoint.sh"]
    command: ["graphql-engine", "serve"]
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
      # Bảng của ứng dụng có trước khi Hasura nạp metadata (#26)
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      bao-agent-hasura:
        condition: service_healthy
    environment:
      SECRETS_REQUIRED: HASURA_GRAPHQL_DATABASE_URL HASURA_GRAPHQL_ADMIN_SECRET
      # Tầng 1 headless: tắt console, tắt dev mode, không gửi telemetry
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      # Kiểm lại JWT của Keycloak (Zero-Trust). Không cần claims_map: Keycloak đã phát claim
      # trong namespace mặc định https://hasura.io/jwt/claims (#13, docs/architecture.md mục 3.1)
      HASURA_GRAPHQL_JWT_SECRET: >-
        {"jwk_url":"http://keycloak:8080/realms/${KEYCLOAK_REALM:-disaster}/protocol/openid-connect/certs",
        "issuer":"${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/${KEYCLOAK_REALM:-disaster}"}
      # Metadata (bảng track, quan hệ, quyền theo vai trò) do ứng dụng cung cấp; lõi chỉ biết quy ước
      # thư mục, giống migrate. Metadata lệch với DB (bảng/cột không có) → dừng khởi động, không
      # chạy với quyền thiếu. Kết nối DB (pool 10) khai báo trong databases.yaml của metadata.
      HASURA_GRAPHQL_METADATA_DIR: /hasura-metadata
      HASURA_GRAPHQL_DISALLOW_INCONSISTENT_METADATA: "true"
      HASURA_GRAPHQL_MIGRATIONS_SERVER_TIMEOUT: "60"
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - secrets-hasura:/run/secrets/dxos:ro
      - ./apps/${DXOS_APP:-cuu-tro}/hasura/metadata:/hasura-metadata:ro
    ports:
      - "127.0.0.1:${HASURA_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m

  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:4.48
    profiles: [core]
    # Master + volume + filer + S3 trong một tiến trình. Khóa S3 (-s3.config) render từ
    # OpenBao secret/core/s3 qua bao-agent-seaweedfs; không ký bằng khóa đúng thì S3 trả 403.
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/run/secrets/dxos/s3.json
      - -master.volumeSizeLimitMB=${SEAWEEDFS_VOLUME_SIZE_MB:-256}
      - -volume.max=0
    depends_on:
      bao-agent-seaweedfs:
        condition: service_healthy
    environment:
      GOMEMLIMIT: 300MiB
    volumes:
      - seaweeddata:/data
      - secrets-seaweedfs:/run/secrets/dxos:ro
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"
    healthcheck:
      # Master sẵn sàng và cổng S3 trả lời (403 khi không ký là đúng: S3 đã bật xác thực)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q ' 403 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 384m

  s3-buckets:
    # Chạy một lần mỗi lần up (#27): tạo bucket mà ứng dụng khai báo trong apps/${DXOS_APP}/s3/buckets.conf
    # (tên bắt buộc tiền tố "<DXOS_APP>-"), bucket đã có thì giữ nguyên. Dùng lại image SeaweedFS
    # (weed shell tới master/filer nội bộ), không kéo thêm image. Script: core/seaweedfs/create-buckets.sh
    image: chrislusf/seaweedfs:4.48
    profiles: [core]
    restart: "no"
    entrypoint: ["sh", "/opt/dxos/create-buckets.sh"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      DXOS_APP: ${DXOS_APP:-cuu-tro}
    volumes:
      - ./core/seaweedfs/create-buckets.sh:/opt/dxos/create-buckets.sh:ro
      - ./apps/${DXOS_APP:-cuu-tro}/s3:/opt/dxos/app-s3:ro
    mem_limit: 128m

  temporal:
    <<: *restart
    # CSDL temporal, temporal_visibility do postgres-roles tạo sẵn (thuộc role temporal, không phải
    # superuser); auto-setup chỉ tạo schema. Mật khẩu (POSTGRES_PWD) từ OpenBao qua bao-agent-temporal.
    # Chỉ dùng cho dev/thi; triển khai thật chuyển sang temporalio/server + admin-tools.
    image: temporalio/auto-setup:1.29.7
    profiles: [core]
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos", "/etc/temporal/entrypoint.sh"]
    command: ["autosetup"]
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
      bao-agent-temporal:
        condition: service_healthy
    environment:
      SECRETS_REQUIRED: POSTGRES_PWD
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      SKIP_DB_CREATE: "true"
      # Ít kết nối DB cho laptop (mặc định 20, visibility 10)
      SQL_MAX_CONNS: "10"
      SQL_MAX_IDLE_CONNS: "5"
      SQL_VIS_MAX_CONNS: "5"
      SQL_VIS_MAX_IDLE_CONNS: "2"
      GOMEMLIMIT: 400MiB
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - secrets-temporal:/run/secrets/dxos:ro
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233 | grep -q SERVING"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    mem_limit: 512m

  temporal-ui:
    <<: *restart
    # Giao diện quản trị CHỈ cho admin: chỉ mở trên 127.0.0.1 của máy chủ (từ xa: SSH tunnel),
    # không đi qua APISIX, không thuộc Tầng 2.
    image: temporalio/ui:2.56.0
    profiles: [core]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      GOMEMLIMIT: 100MiB
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 128m

  bao-agent-nats:
    <<: *bao-agent
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    environment:
      # Chọn secret/app/<DXOS_APP>/nats và đặt tên user/phạm vi subject trong auth.conf.ctmpl
      DXOS_APP: ${DXOS_APP:-cuu-tro}
    volumes:
      - ./core/openbao/agent-nats.hcl:/openbao/config/agent.hcl:ro
      - ./core/nats/auth.conf.ctmpl:/openbao/config/auth.conf.ctmpl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/nats:/openbao/approle:ro
      - secrets-nats:/out/nats
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'thiet-bi' /out/nats/auth.conf"]
      interval: 5s
      timeout: 3s
      retries: 24

  nats:
    <<: *restart
    image: nats:2.15.1-alpine
    profiles: [core]
    # Xác thực bắt buộc (#30): include secrets/auth.conf do bao-agent-nats render, không cho nặc danh
    command: ["-c", "/etc/nats/nats.conf"]
    depends_on:
      bao-agent-nats:
        condition: service_healthy
    environment:
      GOMEMLIMIT: 200MiB
      NATS_JS_MAX_MEMORY: ${NATS_JS_MAX_MEMORY:-64MB}
      NATS_JS_MAX_FILE: ${NATS_JS_MAX_FILE:-1GB}
    volumes:
      - ./core/nats/nats.conf:/etc/nats/nats.conf:ro
      - secrets-nats:/etc/nats/secrets:ro
      - natsdata:/data
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      # Cổng MQTT cho thiết bị/giả lập. Mặc định chỉ 127.0.0.1; thiết bị thật trong mạng LAN:
      # NATS_MQTT_BIND=0.0.0.0 (chưa có TLS, xem core/nats/nats.conf)
      - "${NATS_MQTT_BIND:-127.0.0.1}:${NATS_MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  bao-agent-ledger:
    <<: *bao-agent
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    environment:
      # Chọn secret/app/<DXOS_APP>/ledger (token ghi của backend ứng dụng) trong file writers
      DXOS_APP: ${DXOS_APP:-cuu-tro}
    volumes:
      - ./core/openbao/agent-ledger.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/ledger:/openbao/approle:ro
      - secrets-ledger:/out/ledger
    healthcheck:
      test: ["CMD-SHELL", "test -s /out/ledger/signing_key && grep -q \"^$${DXOS_APP}-api \" /out/ledger/writers"]
      interval: 5s
      timeout: 3s
      retries: 24

  ledger:
    <<: *restart
    # Sổ cái minh bạch (#28, D-007): dịch vụ Go nhúng Tessera, driver POSIX trên volume ledgerdata
    # (filesystem thật của Docker, không s3fs/NFS). Build từ mã nguồn core/ledger; image scratch.
    # Đọc công khai qua APISIX /ledger/* (checkpoint, tile, proof, verifier); ghi POST /ledger/entries
    # CHỈ trong mạng nội bộ kèm token dịch vụ (APISIX chặn mọi phương thức ghi). Không mở cổng ra host.
    build:
      context: ./core/ledger
    image: disaster-dxos/ledger:0.1.0
    profiles: [core]
    depends_on:
      bao-agent-ledger:
        condition: service_healthy
    environment:
      # Chống trùng bền vững dùng BadgerDB: GOMEMLIMIT để GC giữ heap dưới mem_limit
      GOMEMLIMIT: ${LEDGER_GOMEMLIMIT:-150MiB}
      LEDGER_LISTEN: ":8090"
      LEDGER_STORAGE_DIR: /data/log
      LEDGER_ANTISPAM_DIR: /data/antispam
      LEDGER_SECRETS_DIR: /run/secrets/dxos
      LEDGER_CHECKPOINT_INTERVAL: ${LEDGER_CHECKPOINT_INTERVAL:-1s}
    volumes:
      - ledgerdata:/data
      - secrets-ledger:/run/secrets/dxos:ro
    healthcheck:
      test: ["CMD", "/ledger", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 256m

  bao-agent-centrifugo:
    <<: *bao-agent
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    environment:
      # Chọn secret/app/<DXOS_APP>/realtime (khóa ký token kết nối + API key) trong config.json
      DXOS_APP: ${DXOS_APP:-cuu-tro}
    volumes:
      - ./core/openbao/agent-centrifugo.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/centrifugo:/openbao/approle:ro
      - secrets-centrifugo:/out/centrifugo
    healthcheck:
      test: ["CMD-SHELL", "grep -q hmac_secret_key /out/centrifugo/config.json"]
      interval: 5s
      timeout: 3s
      retries: 24

  centrifugo:
    <<: *restart
    # Thông báo realtime qua WebSocket (#68). BẢN OSS (Apache-2.0), KHÔNG dùng Centrifugo PRO (D-004).
    # Client kết nối qua APISIX /realtime/websocket (WAF, rate limit); không mở cổng ra host. HTTP API
    # (/api/publish) chỉ trong mạng nội bộ, kèm X-API-Key: backend ứng dụng đẩy sự kiện lên kênh.
    # Xác thực kết nối: token HS256 ngắn hạn do <DXOS_APP>-api cấp sau khi kiểm JWT Keycloak + vai trò
    # (iss <DXOS_APP>-api, aud centrifugo, claim channels = kênh server-side). Không token, token sai
    # chữ ký/iss/aud hay hết hạn → Centrifugo đóng kết nối (3500). Client không tự đăng ký kênh nào
    # được (mặc định của Centrifugo). Lý do không kiểm thẳng JWT Keycloak: docs/architecture.md mục 3.5.
    # Bí mật (khóa ký, API key) trong file do bao-agent-centrifugo render; tùy chọn khác qua biến
    # CENTRIFUGO_* bên dưới. Engine memory: một nút, lịch sử kênh ngắn để client kết nối lại không mất tin.
    image: centrifugo/centrifugo:v6.9.7
    profiles: [core]
    command: ["centrifugo", "--config", "/run/secrets/dxos/config.json"]
    depends_on:
      bao-agent-centrifugo:
        condition: service_healthy
    environment:
      GOMEMLIMIT: 80MiB
      CENTRIFUGO_LOG_LEVEL: info
      CENTRIFUGO_HEALTH_ENABLED: "true"
      CENTRIFUGO_CLIENT_TOKEN_ISSUER: ${DXOS_APP:-cuu-tro}-api
      CENTRIFUGO_CLIENT_TOKEN_AUDIENCE: centrifugo
      # Origin được mở WebSocket (cách nhau bởi dấu cách): web mở qua gateway. Origin khác → 403
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-${GATEWAY_PUBLIC_URL:-http://localhost:9080}}
      # Mọi kênh (không namespace): giữ 50 tin / 10 phút, client kết nối lại tự lấy bù (recovery)
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_SIZE: "50"
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_TTL: 10m
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_FORCE_RECOVERY: "true"
    volumes:
      - secrets-centrifugo:/run/secrets/dxos:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    mem_limit: 128m

  bao-agent-scorpio:
    <<: *bao-agent
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    volumes:
      - ./core/openbao/agent-scorpio.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/scorpio:/openbao/approle:ro
      - secrets-scorpio:/out/scorpio
    healthcheck:
      test: ["CMD-SHELL", "test -s /out/scorpio/DBPASS"]
      interval: 5s
      timeout: 3s
      retries: 24

  scorpio:
    <<: *restart
    # NGSI-LD broker (#85, D-004): Scorpio Broker (BSD-3-Clause), image gốc bản native "all-in-one" không
    # kèm Kafka/MQTT (các thành phần nội bộ nói chuyện trong bộ nhớ). Lưu thực thể trong CSDL riêng
    # ${SCORPIO_DB} trên PostgreSQL + PostGIS của lõi (role scorpio, postgres-roles tạo CSDL và bật PostGIS;
    # Scorpio tự tạo bảng bằng Flyway). KHÔNG MongoDB. Mật khẩu (DBPASS) từ OpenBao qua bao-agent-scorpio.
    # Scorpio không có xác thực: không mở cổng ra host; backend ứng dụng ghi trong mạng nội bộ
    # (scorpio:9090), người dùng chỉ đọc qua APISIX /ngsi-ld/v1/* (JWT, WAF, chỉ GET). Image chỉ có amd64:
    # Mac Apple Silicon chạy giả lập như postgis (SCORPIO_PLATFORM). Bản native cần AVX/AVX2 mà Rosetta trong
    # VM không có (#99): trên arm64 Makefile đặt SCORPIO_IMAGE = bản JVM cùng phiên bản, SCORPIO_MEM_LIMIT = 1g;
    # core/scorpio/chay.sh chạy đúng lệnh của từng bản. Ghi đè được bằng .env.
    image: ${SCORPIO_IMAGE:-scorpiobroker/all-in-one-runner:linux-amd64-6.0.2}
    platform: ${SCORPIO_PLATFORM:-linux/amd64}
    profiles: [core]
    entrypoint: ["bash", "/opt/dxos/env-from-files.sh", "/run/secrets/dxos", "bash", "/opt/dxos/scorpio-chay.sh"]
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
      bao-agent-scorpio:
        condition: service_healthy
    environment:
      SECRETS_REQUIRED: DBPASS
      DBHOST: postgres
      DBPORT: "5432"
      DBNAME: ${SCORPIO_DB:-scorpio}
      DBUSER: ${SCORPIO_DB_USER:-scorpio}
      # Pool kết nối PostgreSQL: mặc định của Quarkus (20 reactive + JDBC) vượt CONNECTION LIMIT 20 của role
      # scorpio khi ghi dồn (Scorpio báo "too many connections" bằng HTTP 400). Hết kết nối thì request xếp hàng.
      QUARKUS_DATASOURCE_REACTIVE_MAX_SIZE: ${SCORPIO_DB_POOL:-8}
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: "2"
      # Chỉ bản JVM đọc (bản native bỏ qua): heap theo mem_limit, GC một luồng cho container nhỏ
      JAVA_TOOL_OPTIONS: ${SCORPIO_JAVA_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC}
    volumes:
      - ./core/openbao/env-from-files.sh:/opt/dxos/env-from-files.sh:ro
      - ./core/scorpio/chay.sh:/opt/dxos/scorpio-chay.sh:ro
      - secrets-scorpio:/run/secrets/dxos:ro
    read_only: true
    tmpfs:
      # Bản JVM giải nén thư viện native (netty…) vào /tmp
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Image không có curl/wget/grep: gọi /q/health/ready bằng /dev/tcp và so dòng trạng thái trong bash
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /q/health/ready HTTP/1.0\r\n\r\n' >&3 &&
          read -r dong <&3 && [[ $$dong == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    # Bản native ~200 MB; bản JVM (arm64) cần ~1 GB, bị OOM ở 384m (#99)
    mem_limit: ${SCORPIO_MEM_LIMIT:-384m}

  # ======================= profile: bi (#92) =======================
  bao-agent-grafana:
    <<: *bao-agent
    profiles: [bi]
    command: ["agent", "-config=/openbao/config/agent.hcl"]
    environment:
      # Chọn secret/app/<DXOS_APP>/bi-db (role chỉ đọc của ứng dụng) trong agent-grafana.hcl
      DXOS_APP: ${DXOS_APP:-cuu-tro}
    volumes:
      - ./core/openbao/agent-grafana.hcl:/openbao/config/agent.hcl:ro
      - ${OPENBAO_LOCAL_DIR:-./.data/openbao}/approle/grafana:/openbao/approle:ro
      - secrets-grafana:/out/grafana
    healthcheck:
      test: ["CMD-SHELL", "test -s /out/grafana/admin_password && test -s /out/grafana/bi_db_password && test -s /out/grafana/oauth_client_secret"]
      interval: 5s
      timeout: 3s
      retries: 24

  keycloak-grafana-client:
    # Container một lần (#126): tạo/cập nhật client Keycloak dxos-grafana trong realm đang chạy bằng kcadm.sh
    # (core/keycloak/grafana-client.sh). Realm chỉ import khi CSDL Keycloak trống, nên máy đã chạy realm cũ
    # cũng nhận client mỗi lần bật profile bi. Image Keycloak gốc, cùng phiên bản với dịch vụ keycloak.
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [bi]
    entrypoint: ["bash", "/opt/dxos/keycloak/grafana-client.sh"]
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-disaster}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:9080}
    volumes:
      - ./core/keycloak:/opt/dxos/keycloak:ro
      - secrets-keycloak:/run/secrets/dxos:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    mem_limit: 256m

  grafana:
    <<: *restart
    # Dashboard điều hành (#92). Grafana OSS là AGPL-3.0: chạy như DỊCH VỤ RIÊNG bằng image gốc, không sửa mã,
    # không nhúng vào mã dự án (NOTICE, DEPENDENCIES.md). Datasource + dashboard nạp từ tệp (provisioning):
    # core/grafana/provisioning (datasource PostgreSQL bằng role chỉ đọc <schema>_bi), dashboard JSON của ứng
    # dụng apps/${DXOS_APP}/grafana/dashboards. Không mở cổng ra host: mở qua APISIX ${GATEWAY_PUBLIC_URL}/grafana/.
    # Không tải plugin hay tin tức từ Internet lúc chạy.
    # Đăng nhập (#126): SSO Keycloak (generic OAuth, client dxos-grafana confidential + PKCE S256), form đăng nhập
    # tắt. Vai realm → vai Grafana: dieu-phoi → Editor, cuu-ho → Viewer, vai khác bị từ chối (role_attribute_strict);
    # không ai thành Grafana Admin qua SSO. Tài khoản admin (mật khẩu trong OpenBao secret/core/grafana) chỉ để
    # khẩn cấp: Basic auth cho API, hoặc GRAFANA_LOGIN_FORM_DISABLED=false để mở lại form (apps/cuu-tro/README.md).
    # Trình duyệt đi tới Keycloak bằng KEYCLOAK_PUBLIC_URL; Grafana đổi code lấy token qua mạng nội bộ.
    image: grafana/grafana-oss:13.0.2
    profiles: [bi]
    depends_on:
      bao-agent-grafana:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
      keycloak-grafana-client:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/dxos/admin_password
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # lax (không phải strict): trình duyệt quay về /grafana/login/generic_oauth từ Keycloak (khác site khi
      # triển khai thật) phải gửi kèm cookie oauth_state + PKCE verifier, nếu không Grafana báo "missing saved state"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_LOGIN_FORM_DISABLED:-true}
      GF_AUTH_OAUTH_AUTO_LOGIN: ${GRAFANA_LOGIN_FORM_DISABLED:-true}
      # Đăng xuất Grafana thì đăng xuất luôn phiên Keycloak rồi quay về /grafana/login (dòng nối bằng "\")
      GF_AUTH_SIGNOUT_REDIRECT_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/${KEYCLOAK_REALM:-disaster}\
        /protocol/openid-connect/logout?client_id=dxos-grafana\
        &post_logout_redirect_uri=${GATEWAY_PUBLIC_URL:-http://localhost:9080}/grafana/login"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: dxos-grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/dxos/oauth_client_secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/${KEYCLOAK_REALM:-disaster}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-disaster}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-disaster}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'dieu-phoi') && 'Editor' || contains(roles[*], 'cuu-ho') && 'Viewer' || ''"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
      # Tài khoản Grafana tạo khi người dùng Keycloak đăng nhập lần đầu (khác GF_USERS_ALLOW_SIGN_UP: tự đăng ký)
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_SERVER_ROOT_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:9080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DEFAULT_LOCALE: vi-VN
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/dxos/dashboards/dieu-hanh.json
      # Datasource (core/grafana/provisioning/datasources): role chỉ đọc của ứng dụng đang chọn
      # (<DXOS_APP đổi - thành _>_bi; DXOS_APP khác cuu-tro thì đặt APP_BI_DB_USER)
      BI_DB_HOST: postgres:5432
      BI_DB_NAME: ${POSTGRES_DB:-disaster}
      BI_DB_USER: ${APP_BI_DB_USER:-cuu_tro_bi}
    volumes:
      - ./core/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./apps/${DXOS_APP:-cuu-tro}/grafana/dashboards:/etc/dxos/dashboards:ro
      - grafanadata:/var/lib/grafana
      - secrets-grafana:/run/secrets/dxos:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # /api/health trả 503 khi CSDL của Grafana (sqlite trong volume) chưa dùng được
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || curl -fs -o /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    mem_limit: 384m

  # ======================= profile: ai (#102) =======================
  ollama:
    # Máy chạy mô hình ngôn ngữ mở (Ollama, MIT), dịch vụ riêng của lõi: lõi không biết nghiệp vụ, ứng dụng
    # gọi http://ollama:11434/api/chat trong mạng nội bộ (LLM_PROVIDER=ollama). Không mở cổng ra máy host,
    # không đi qua gateway: người dùng chỉ gọi API của ứng dụng (/workflow/ai/*) có JWT + giới hạn tần suất.
    # Trọng số mô hình nằm trong volume ollamadata (tải bằng ollama-pull), KHÔNG nằm trong repo.
    # Docker trên macOS không dùng được GPU Apple: mô hình chạy CPU (đo được: docs/architecture.md mục 4).
    <<: *restart
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.3}
    profiles: [ai]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Một mô hình, một yêu cầu một lúc: giữ RAM trong giới hạn laptop; giữ mô hình trong RAM 30 phút
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_CONTEXT_LENGTH: "2048"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Qwen2.5 7B Q4_K_M ~4,7 GB trọng số + ngữ cảnh 4096; 14B cần đặt OLLAMA_MEM_LIMIT=14g
    mem_limit: ${OLLAMA_MEM_LIMIT:-8g}

  ollama-pull:
    # Chạy một lần mỗi lần up: tải mô hình LLM_MODEL về volume (đã có thì chỉ kiểm lại). Chặn mô hình không
    # được phép (Llama, Gemma; Qwen2.5 3B/72B không phải Apache-2.0), cùng luật với cuu_tro_workflow.config.
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.3}
    profiles: [ai]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if printf '%s' "$$LLM_MODEL" | grep -Eiq 'llama|gemma|qwen2\.5[-:_]?(coder[-:_]?)?(3b|72b)'; then
        echo "LLM_MODEL=$$LLM_MODEL không được phép (giấy phép không phải Apache-2.0/OSI)" >&2; exit 1; fi;
        ollama pull "$$LLM_MODEL"

  # ===================== profile sec =====================
  clamav:
    <<: *restart
    # Quét mã độc tệp tải lên (#111). ClamAV là GPL-2.0: DỊCH VỤ RIÊNG bằng image gốc, không sửa, không liên
    # kết vào mã dự án; ứng dụng nói chuyện qua giao thức mạng clamd (TCP 3310, INSTREAM). Lõi không biết tệp gì
    # được quét: backend của ứng dụng gọi tới clamav:3310 trong mạng nội bộ. Không mở cổng ra host, không qua APISIX.
    # Image bản đầy đủ có sẵn bộ chữ ký (main/daily/bytecode) nên quét được ngay cả khi không có mạng; volume
    # clamavdata nhận bản đó lần đầu, freshclam (trong cùng container) cập nhật mỗi ngày CLAMAV_FRESHCLAM_LAN lần
    # khi có mạng. CLAMAV_NO_FRESHCLAMD=true để tắt cập nhật (máy không ra Internet). Nạp bộ chữ ký mất ~20–60 giây.
    image: clamav/clamav:1.5.4-debian13-slim
    profiles: [sec]
    environment:
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-false}
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: ${CLAMAV_FRESHCLAM_LAN:-2}
      # Tệp lớn nhất nhận qua INSTREAM: lớn hơn giới hạn ảnh của ứng dụng (ANH_MAX_BYTES 10 MiB)
      CLAMD_CONF_StreamMaxLength: 25M
      CLAMD_CONF_MaxFileSize: 25M
      CLAMD_CONF_MaxScanSize: 100M
    volumes:
      - clamavdata:/var/lib/clamav
    # Healthcheck của image (clamdcheck.sh, chờ tối đa 6 phút lúc khởi động)
    mem_limit: ${CLAMAV_MEM_LIMIT:-2g}
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  baodata:
  seaweeddata:
  natsdata:
  ledgerdata:
  grafanadata:
  ollamadata:
  clamavdata:
  secrets-keycloak: *secrets-tmpfs
  secrets-postgres: *secrets-tmpfs
  secrets-apisix: *secrets-tmpfs
  secrets-hasura: *secrets-tmpfs
  secrets-temporal: *secrets-tmpfs
  secrets-seaweedfs: *secrets-tmpfs
  secrets-nats: *secrets-tmpfs
  secrets-ledger: *secrets-tmpfs
  secrets-centrifugo: *secrets-tmpfs
  secrets-scorpio: *secrets-tmpfs
  secrets-grafana: *secrets-tmpfs
