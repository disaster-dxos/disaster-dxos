# SPDX-License-Identifier: Apache-2.0
# Yêu cầu PoF: license đầy đủ (#1), build được 100% từ mã nguồn (#3), lint/test từng thành phần (#31).
# Tên job ổn định để bật bắt buộc trong bảo vệ nhánh: license, build-from-source, shellcheck, yamllint, pytest.
# Sổ cái core/ledger (Go, #28): go-test (gofmt, go vet, go test) và go-licenses (chỉ giấy phép OSI).
# Web điều phối (Nuxt, #59): job web (giấy phép npm, Vitest, typecheck, build, image Docker #64), chưa bắt buộc.
# App hiện trường (React Native, #106, D-011): job mobile (giấy phép npm, typecheck, lint, Jest), không build native.
name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - run: bash scripts/check-license.sh

  build-from-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - run: cp .env.example .env
      - run: docker compose --profile '*' config --quiet
      # Compose hợp lệ với mọi ứng dụng cắm vào lõi (apps/<tên>/compose.yaml, #110)
      - name: Compose hợp lệ với từng module trong apps/
        run: |
          for a in apps/*/compose.yaml; do
            app=$(basename "$(dirname "$a")")
            DXOS_APP=$app docker compose --profile '*' config --quiet
            echo "OK: DXOS_APP=$app"
          done
      # --profile '*': dựng mọi image build từ nguồn trong repo (vd core/apisix: APISIX + Coraza WAF)
      - run: docker compose --profile '*' build

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      # shellcheck có sẵn trên runner ubuntu-24.04
      - run: shellcheck --version
      - run: bash scripts/lint.sh shell

  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - run: pip install yamllint==1.35.1
      - run: bash scripts/lint.sh yaml

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Tìm mã Python
        id: detect
        run: |
          if [ -n "$(git ls-files -- '*.py' ':(glob)**/tests/**')" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Chưa có mã Python hoặc thư mục tests/ — bỏ qua pytest." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - if: steps.detect.outputs.found == 'true'
        name: Cài phụ thuộc
        run: |
          python -m pip install pytest==8.3.4
          git ls-files -- 'requirements*.txt' ':(glob)**/requirements*.txt' | while read -r r; do
            python -m pip install -r "$r"
          done
      - if: steps.detect.outputs.found == 'true'
        name: Chạy pytest
        # Mã 5 = không thu thập được test nào: coi là đạt khi mới có mã Python mà chưa có test
        run: python -m pytest -q || [ $? -eq 5 ]

  go-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core/ledger
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: core/ledger/go.mod
          cache-dependency-path: core/ledger/go.sum
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then gofmt -l .; echo "Chạy gofmt -w core/ledger"; exit 1; fi
      - run: go vet ./...
      - run: go test -count=1 ./...

  go-licenses:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core/ledger
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: core/ledger/go.mod
          cache-dependency-path: core/ledger/go.sum
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      # Mọi gói Go được biên dịch vào core/ledger phải có giấy phép OSI trong danh sách (DEPENDENCIES.md).
      # Bỏ qua module của chính repo (Apache-2.0, LICENSE ở gốc repo, ngoài thư mục module).
      - name: Kiểm giấy phép phụ thuộc Go
        run: |
          go-licenses check ./... \
            --ignore github.com/disaster-dxos/disaster-dxos \
            --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC,MPL-2.0
      - name: Báo cáo giấy phép
        if: always()
        run: go-licenses report ./... --ignore github.com/disaster-dxos/disaster-dxos | sort | tee -a "$GITHUB_STEP_SUMMARY"

  # Web điều phối apps/cuu-tro/web (Nuxt, #59). Chưa nằm trong danh sách job bắt buộc của bảo vệ nhánh.
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/cuu-tro/web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/cuu-tro/web/package-lock.json
      - run: npm ci
      # Mọi gói npm (kể cả gián tiếp) phải có giấy phép OSI tương thích Apache-2.0 (DEPENDENCIES.md)
      - run: npm run licenses
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # Image chạy thật (apps/cuu-tro/web/Dockerfile, #64): build từ nguồn rồi chạy thử, kiểm trang chủ,
      # header bảo mật và user không phải root. build-from-source cũng dựng image này qua compose.
      - name: Build image Docker
        run: docker build --build-context logo=../../../docs/images/logo -t cuu-tro-web:ci .
      - name: Chạy thử image
        run: |
          docker run -d --name web -p 127.0.0.1:3000:3000 --read-only --cap-drop ALL cuu-tro-web:ci
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          curl -s -D h.txt -o index.html http://127.0.0.1:3000/
          grep -qi '^content-security-policy:.*frame-ancestors' h.txt
          grep -qi '^x-frame-options: DENY' h.txt
          grep -q 'id="__nuxt"' index.html
          test "$(docker exec web id -u)" != 0
          docker rm -f web
  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/cuu-tro/mobile
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22.22.3"
      # Yarn 4 qua Corepack theo trường packageManager (không đưa bản Yarn vào repo)
      - run: corepack enable
      - run: yarn install --immutable
      # Mọi gói npm (kể cả gián tiếp) phải có giấy phép OSI tương thích Apache-2.0 (DEPENDENCIES.md)
      - run: yarn licenses
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test --ci
